<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LamBert</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:#bfe0fb;color:#1d3557;font-family:-apple-system,Helvetica,Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center}
canvas{max-width:100%;max-height:100%;display:block}
#nameBox{position:fixed;left:0;right:0;top:7%;display:flex;justify-content:center;z-index:5;touch-action:auto}
#nameBox[hidden]{display:none}
#nameBox .card{background:#fffdf6;border:2px solid #3d4650;border-radius:14px;padding:14px 18px 16px;width:min(300px,84vw);text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.25)}
#nameBox .big{font-size:22px;font-weight:bold;color:#b4531a}

</style></head><body>
<canvas id="c" width="760" height="680"></canvas>
<div id="nameBox" hidden><div class="card"><div class="big">New high score!</div><div id="nameScore"></div>
<input id="nameInput" maxlength="12" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done" placeholder="Type your name">
<button id="nameOk">OK</button></div></div>
<script>
/* =====================================================================================
   LamBert: a Q*bert-style arcade game with an original twist, all in this one HTML file.
   =====================================================================================
   This comment is documentation for humans, and for a future Claude who is handed this file at
   the start of a brand-new chat. It records WHAT we are building and WHY each decision was made.
   The owner is a programmer (Java, Python, data science) who had never built an app or website
   before. He plays in Safari on a MacBook Pro and on an iPhone/iPad. The code could not be run
   or seen while it was written, so he plays it and reports back; many numbers are tuned by feel.

   1. THE GAME
   -----------
   LamBert is a chubby black-faced lamb hopping around a meadow made of rock columns that float in a
   pale blue sky. He must eat all the grass (a column top is bright green until he lands on it,
   then it turns a pale khaki) while avoiding monsters. When every patch is eaten the level is
   cleared and a new random meadow appears. Monsters: red balls, and Wolfy, a lean hungry wolf who
   rolls down the structure disguised as a badly made sheep costume (a woolly ball with crooked
   ears and two mismatched eyes). Two balloons per level let LamBert escape to the top.
   It is modelled on the 1980s arcade game Q*bert, with these deliberate differences:
     - THE TWIST: the board is not a pyramid but a randomly thinned N x N x N block of cubes (section 2).
     - Hops of 0 levels are allowed (the original always hops up or down exactly one level).
     - Escape balloons (the original has flying discs) are placed at random on jagged edges.
     - All characters, names, colors and art are original (see the legal note in section 9).

   2. THE BOARD (the twist)
   ------------------------
   - Start with a full N x N x N cube (N = 6; change the constant N and everything adapts), viewed from a
     corner so it looks like a hexagon. Remove cubes with a random walk (gen): pick a random grid cell;
     if it holds a cube and nothing sits in front of it (toward the viewer) remove it ('only a fully
     visible cube may be removed'); if it is empty and fully supported from below and from both back sides
     add a cube ('only a fully supported cube may be added'). Walk 100 * N^3 steps; always keep >= 1 cube.
   - Consequence (important): column heights h[i][j] never increase toward the viewer, so no column hides
     another and EVERY column top is visible. The structure has no floating cubes from any of the three
     viewing directions. (Mathematically these shapes are 'plane partitions' in a box.)
   - The imaginary floor and the two imaginary back walls are INVISIBLE. Hopping onto an empty column or off
     the structure means falling to your doom. Falling out through a back wall is drawn BEHIND the cubes.
   - Solvability: some random shapes cannot be finished (LamBert may hop up only 1 level, so he can get
     stranded below a cliff). newLevel keeps generating until solvable() passes (about 80% of N=5 shapes do, a little fewer at N=6).
     solvable() = for every pair of columns, one can be reached from the other without falling (so a route
     covering everything exists), AND some column can reach the rear-most one again (see rule 4 below).
     Even a solvable level can require careful ordering; that is intended.

   3. COORDINATES AND DRAWING
   --------------------------
   - Cube (i, j, k): i and j run along the two horizontal axes, k is height. The viewer looks from large
     i, j, k. c[i][j][k] = 1 if a cube exists; h[i][j] = height of column (i, j); the column (0, 0) is the
     rear-most one (also the tallest). P(x, y, z) projects a grid point to the screen (isometric, A pixels
     per cube edge). Hops: (di, dj) = (-1, 0) is up-left, (0, -1) up-right, (1, 0) down-right, (0, 1) down-left.
   - Draw order: sky; anything behind a back wall; the cubes far-to-near; balloons; then all characters
     sorted by depth x + y + z (nearer = larger, so a nearer character covers a farther one); LamBert
     riding a balloon is drawn last. Heights never increase toward the viewer, so characters standing on
     column tops are never hidden by cubes.
   - Random-looking details (flowers, rock shades, crack shapes) come from hh(), a hash of the cube
     position plus levelSeed (new each level), so they stay still during a level and differ between levels.

   4. RULES OF PLAY
   ----------------
   1. Controls: keys Q (up-left), E (up-right), Z (down-left), C (down-right), or the arrow keys rotated
      45 degrees (left = up-left, up = up-right, down = down-left, right = down-right); on a touch screen a
      diagonal swipe anywhere; tap or press Space to restart after Game over; the M key or the speaker button (bottom right) mutes sound. (We decided against on-screen arrow buttons
      and against tapping a column: swipes keep the risk of falling, which is part of the fun.)
   2. LamBert may hop UP at most 1 level (a higher hop is blocked: he makes a little hop in place so the player
      sees he tried), or stay level, or go DOWN any amount. Hopping to an empty column or off the structure: he falls and loses a life.
   3. Score: 25 per patch eaten, 1,000 per level cleared, 500 when Wolfy follows him off the edge. An extra life
      comes at 8,000 points and then every 14,000 points (22,000, 36,000, ...). He starts with 3 lives: the one
      in play plus 2 spares, and the spares are shown as little pictures of LamBert in a column down the far
      left edge (as in the original game; a column hides the balloons least), not as a number.
      Level clear = every column eaten.
      High scores: when the last life is lost, endGame() checks whether the score is in the best 10. If so, a
      'New high score!' box (an HTML text field, so an iPhone keyboard works) asks for a name (up to 12 letters,
      the last name used is filled in, empty = 'Anonymous'); Enter or OK saves it. The table (best first, with the level
      reached, the new row highlighted) then shows on the Game over screen, and a restart is accepted only after a
      short pause (overT) and after the name is entered. The table is kept in the browser's localStorage under 'lambert-scores'
      (the last name under 'lambert-name'): it lives on each player's own device and browser, NOT on the web site that
      hosts the file, so players never see each other's scores. (A shared leaderboard would need a server.)
   4. As in the original, the rear-most column does NOT count when he starts or respawns there; he must hop
      away and land back on it (hence solvable() requires a way back up to it).
   5. Touching a monster kills him, any of these ways: he lands on it, it lands on him, or they hop toward
      each other's spots and meet in mid-air (checkSwap). Death freezes everything for 0.5 s (DEATH_PAUSE).

   5. MONSTERS (all hop one column at a time, only onto columns that have cubes)
   -----------------------------------------------------------------------------
   - Spawning: the first ball 3 s after a level starts, then every 4 s (SPAWN_EVERY), if fewer than 3 monsters are on the board, a ball drops straight down
     from the top of the screen onto a column next to the rear-most one (never onto it, so a LamBert who
     stands still there is safe). Red ball: hops randomly toward the viewer and falls off the bottom.
     Costume ball (Wolfy in disguise): same, but when it reaches a column with no way on it sits and shakes
     for 1.5 s, then the costume pops (puffs of wool) and Wolfy appears. Only ONE costume/Wolfy at a time.
   - The chance that a spawn is a costume ball is 20% + 20% for every red ball since the last costume, so
     at most 4 reds in a row (the owner disliked long waits; a flat probability caused them).
   - Wolfy chases LamBert along a shortest route (breadth-first search) obeying the same hop-up limit as
     LamBert (WOLFY_MAX_UP = 1; the owner may later allow 2). If LamBert cannot be reached he wanders around
     looking frustrated. A Wolfy is 'stranded' when he cannot get to the column LamBert is on (if he can reach
     the rear-most column he can always reach LamBert). He re-decides before every hop: while stranded, after
     (columns he is confined to + 7) more hops he jumps to his doom, so he can never block the grass for good;
     but if LamBert moves where he can reach, he gives up on the edge and chases again.
   - Balloon lure: while LamBert rides a balloon, Wolfy blindly runs to the column LamBert jumped from and, if
     he gets there in time, hops off the edge after him (the original does this with Coily the snake).
   - Original characters: the owner first liked a snake that hatches from an egg (as in the original game),
     but a wolf in a sheep costume suits the lamb theme better.

   6. BALLOONS (escape)
   --------------------
   - Each level has one balloon beside each back edge (yellow left, pink right), on a random edge column
     (never the rear-most one), more likely the farther it is from the rear-most column so rides are long.
     Each can be used once per level; they come back next level.
   - Hop up and through the rear wall from that column: the hop rises BALLOON_LIFT (1/4 cube) and LamBert
     grabs the string with his front legs ('arms', as in Shaun the Sheep). Before he grabs it the string hangs
     lower (BALLOON_TAIL) so players see which column to jump from. The balloon lifts him straight up one cube,
     then glides in a straight line at constant speed (RIDE_SPEED) to RIDE_TOP (1.5 cubes) above the rear-most
     stack, pops, and he drops onto it (an ordinary landing: it eats that patch). Up to a third of the balloon
     may float off the top of the screen. While riding LamBert cannot be hit.

   7. TIMING (seconds; all are constants near the code that uses them)
   -------------------------------------------------------------------
   LamBert: hop 0.2 + rest 0.2 (one key press during the rest is remembered). Balls: hop 0.25 + rest 0.35.
   Wolfy: hop 0.25 + rest 0.25. Original-style feel: LamBert only slightly faster than the monsters.

   7b. SOUND
   ---------
   The owner prefers simple synthesized bleeps and bloops, like 1980s video games, so MOST sounds are made in code
   with the Web Audio API: a soft tick for each hop (there is deliberately NO sound for eating grass), a very quiet
   bounce for the balls (many balls bounce at once, so it is also limited to one every 90 ms), a soft pop for the
   balloon (the owner found the first one too harsh and loud), a yelp when Wolfy falls, a bleat ('baa') when a monster catches LamBert, a little bonk when he tries to hop too
   high, a chime for an extra life and a jingle for a cleared level. No music.
   VOLUMES: the synthesized sounds all go through tone() and noiseBurst(), which multiply their volume by SOUND_BOOST
   (2.5; the owner found them too quiet next to the recorded bleat). The bleat (BLEAT_VOLUME) and growl (GROWL_VOLUME)
   are the owner's chosen levels: the growl is 'perfect', so leave both alone when changing SOUND_BOOST.
   RECORDED CLIPS: only TWO sounds are real recordings, because the owner wanted them to sound natural:
   'bleat' (LamBert falls off the cube structure; BLEAT_VOLUME) and 'growl' (Wolfy growls while the costume shakes,
   starting GROWL_LEAD seconds before it pops so the growl ends as it bursts; GROWL_VOLUME). The owner tried a
   recorded howl and a recorded chomp and did not like them, so they were removed: do not add them back. There is
   no howl at all now (the growl is the only sound as the costume bursts), and no sound for eating grass.
   A clip is an mp3 stored as base64 text inside the SOUND_CLIPS block at the very bottom of the file (a second
   <script> tag), so the game stays ONE file that works from GitHub Pages or by double-click. loadClips() decodes
   them when sound is first unlocked; playClip(name, vol) plays one; the bleat falls back to the old synthesized
   falling whistle if its clip is not ready. Clips are small (about 7 KB each); to shrink a clip: ffmpeg -i in.mp3
   -ac 1 -ar 22050 -b:a 48k out.mp3. Use only CC0 / public-domain clips (the owner has asked about the App Store
   and ads). To add a clip: base64-encode the mp3, add a key to SOUND_CLIPS, add a VOLUME constant, and use
   playClip() in sound().
   A speaker button (bottom right; the M key too) mutes and unmutes, and the choice is remembered. Sound starts ON
   on a computer and OFF on a touch device (people play in public). Browsers only allow sound after the first key
   press or touch, and an iPhone's silent switch may mute it.

   8. LOOK AND STYLE DECISIONS
   ---------------------------
   - Meadow of rock columns in a pale blue sky with two still fluffy clouds: tops are tasty green (about 1 in 6
     has a daisy), eaten patches turn pale yellowish-green khaki (not dirt brown: 'not a sickly brown'), sides
     are gray rock, LEFT sides lighter and RIGHT sides darker with only slight shade variation per rock, and
     just 2-3 thin cracks on the whole structure. Flat colors and simple shapes so everything stays readable on a
     small phone screen. The canvas is only as wide as the cube structure plus a small margin (its width is worked
     out from its fixed height), so the structure fills the width of an iPhone held upright; the score and level
     text, the 'Lamβert' logo (a joke spelling used ONLY in the logo; everywhere else the name is LamBert; dark
     letters on a little irregular cloud of wool, with a hand-drawn rose β) and the clouds all stay inside that width.
     Other HUD: score and level at top left; the spare lives as a column of little lambs down the left edge.
   - GRASS: the column tops now show small tufts of grass blades (18 per patch, TUFTS_PER_PATCH, growing out to within GRASS_MARGIN of the patch edge; three greens; constants GRASS_STYLE, BLADE_COLORS) on the
     bright green top, and an eaten patch keeps a few short khaki stubs. The ORIGINAL look is kept: set GRASS_STYLE = 'flat'
     for a plain flat green top (GRASS, #62d24a, thin dark outline) with the occasional daisy, and plain flat khaki when eaten.
   - LamBert: chubby and cute, white wool, dark face/ears/legs, big head, turns to face the way he hops (front or
     back view, left or right), stretches in the air, squashes on landing, ears flop. From behind, his body is
     drawn over his head. Wolfy: lean, hungry, scary (long legs and snout, slanted brows, tongue and fang), turns
     to face his way too. Red ball: glossy, no eyes, squashes when it bounces. The monsters' hop animations
     are stretch-and-squash only.

   9. LEGAL NOTE
   -------------
   Game rules and mechanics are generally not protected by copyright, but characters, names, art and sounds
   are. So the mechanics follow Q*bert while every visible and audible element is original (lamb, wolf,
   balloons, meadow). Do not reuse Q*bert's names (Coily, Slick, Sam, Ugg, Wrongway), designs or sounds.
   If this is ever published (the owner has asked about the App Store and ads) get an IP lawyer's opinion
   first, and check the name LamBert is not too close to Q*bert.

   10. HOW THE CODE IS ORGANIZED (roughly top to bottom)
   -----------------------------------------------------
   Constants (N, timings, colors) -> canvas size and projection P() -> gen() board generator -> solvable() ->
   place/newLevel -> move() (input) -> addScore() (points and extra lives), high scores (loadScores, qualifies, endGame, submitName), landed(), die(), update() (game logic,
   one call per frame) -> monsters (spawn, decide, chase, reachableFrom, doomedHop, hopTo, updateEnemies,
   checkSwap) -> balloons and the ride (makeBalloons, startRide, updateRide, ridePos) -> sound (sound, tone,
   noiseBurst, loadClips, playClip, toggleSound, drawSpeaker) -> keyboard and touch handlers -> drawing (drawSky, drawCubes (with tufts), drawScoreTable,
   drawPlayer = LamBert, drawWolfy, drawCostume, drawRedBall, drawBalloon, drawPops, drawLogo, drawLives, draw)
   -> the frame loop. (Function declarations are hoisted, so the order in the file is only roughly this.)
   Main state: c, h, seen (eaten patches), pi/pj (LamBert's column), hop, fall, ride, bump, rest, queued, facing,
   enemies (kinds 'red', 'costume', 'wolfy'), balloons, pops, cracks, levelSeed, score, lives, level, dying,
   pause, over, highScores, entering, lastRank, overT, audio. Characters are drawn from the point where their feet touch a column top. Naming: LamBert's
   constants start LAMBERT_, Wolfy's WOLFY_, the balloons' BALLOON_; a 'costume' is the woolly ball that becomes Wolfy.

   11. IDEAS NOT DONE YET
   ----------------------
   Sound effects are done (see 7b) but the author of the code has never heard them: expect to tune volumes.
   Still open: difficulty that grows with the level (faster or more monsters), more variety in the higher levels (new
   enemies, new looks; the owner is considering it), and tuning after more play-testing. Worth re-checking after
   any change: how the screen fits on an iPhone held upright, that balloons are not hidden by cubes on odd
   shapes, and that every level can still be finished. Visual polish is done in small steps and the owner
   reviews each step before the next.

   12. HOW TO WORK WITH THE OWNER
   ------------------------------
   He likes to discuss options and hear an honest opinion BEFORE anything is built, then to approve changes in
   small steps, and he describes problems precisely (a good sign: trust his observations). Keep every tunable
   number a named constant, keep the code readable (descriptive names, comments), and explain the reasoning
   behind changes. Say plainly when something could not be tested.

   13. PRACTICAL NOTES FOR WHOEVER EDITS THIS FILE
   -----------------------------------------------
   - The game cannot be seen or played while it is being edited, only read and syntax-checked (for example in
     node: take the text between the script tags and run it through new Function(...)). Re-read the code around
     any change, and ask the owner to play it and report back.
   - Make small, exact edits rather than rewriting the file, and keep THIS COMMENT up to date with every change
     in rules, numbers or look: it is the only memory a brand-new chat has. (Some notes also live in Claude's
     memory, but this comment is the authority.)
   - Names: the game and its lamb are LamBert everywhere except the logo (Lamβert). The wolf is Wolfy. The
     original game's snake is Coily: never use that name. Wolfy's disguise is the 'costume' ball.
   - Decisions the owner has already made and does not want reopened without a good reason: swipes (no arrow
     buttons, no tap-on-column), balloons (no baskets, no flying discs), N = 6, a chubby black-faced LamBert,
     a lean scary Wolfy, no background music.
   ===================================================================================== */
const N = 6;                       // size of the big cube: change this to try other sizes
const WALK_STEPS = 100 * N * N * N; // random-walk steps used to build each level
const LIVES = 3;   // lives at the start, counting the one in play (the other 2 are shown as little lambs)

const cv = document.getElementById('c'), g = cv.getContext('2d');
const H = cv.height;   // the height is fixed; the width is worked out from it so the cube structure nearly fills the width
const A = (H - 150) / (2 * N);   // cube edge in pixels
const W = Math.round(2 * N * 0.866 * A + 24); cv.width = W;   // canvas width = width of the cube structure plus a small margin
const OX = W / 2, OY = H / 2 + 30;
// Project grid point (x,y,z) to the screen. The viewer sits at large x, y, z.
function P(x, y, z) { return [OX + (x - y) * A * 0.866, OY + (x + y) * A * 0.5 - z * A]; }

let c, h, seen, pi, pj, hop = null, fall = null;
let score = 0, lives = LIVES, level = 1, msg = '', pause = false, over = false;

// c[i][j][k] = 1 if a cube is present. A cube needs its three neighbours toward the
// back corner (i-1, j-1, k-1) present, or the imaginary floor/walls (index 0).
function gen() {
  c = Array.from({length: N}, () => Array.from({length: N}, () => Array(N).fill(1)));
  let n = N * N * N;
  const has = (i, j, k) => i >= 0 && j >= 0 && k >= 0 && i < N && j < N && k < N && c[i][j][k] === 1;
  for (let s = 0; s < WALK_STEPS; s++) {
    const i = Math.random() * N | 0, j = Math.random() * N | 0, k = Math.random() * N | 0;
    if (c[i][j][k]) {
      // remove only if fully visible (nothing in front of it) and at least one cube stays
      if (n > 1 && !has(i + 1, j, k) && !has(i, j + 1, k) && !has(i, j, k + 1)) { c[i][j][k] = 0; n--; }
    } else if ((i === 0 || has(i - 1, j, k)) && (j === 0 || has(i, j - 1, k)) && (k === 0 || has(i, j, k - 1))) {
      c[i][j][k] = 1; n++;   // add only if fully supported
    }
  }
  h = c.map(r => r.map(col => col.reduce((a, b) => a + b, 0)));
  seen = h.map(r => r.map(() => false));
}

function place() {            // drop onto the top cube of the rearmost stack
  pi = 0; pj = 0; hop = null; fall = null; rest = 0; queued = null; ride = null; bump = null;
  facing = {away: false, right: true};
}
// A level is finishable if, for every pair of columns, one can be reached from the other
// without falling (empty columns are fatal; hopping up 2 or more is blocked).
function solvable() {
  const cols = [];
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (h[i][j] > 0) cols.push([i, j]);
  const id = (i, j) => i * N + j;
  const R = Array.from({length: N * N}, () => Array(N * N).fill(false));
  for (const [i, j] of cols) {
    R[id(i, j)][id(i, j)] = true;
    for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const a = i + di, b = j + dj;
      if (a >= 0 && b >= 0 && a < N && b < N && h[a][b] > 0 && h[a][b] - h[i][j] < 2) R[id(i, j)][id(a, b)] = true;
    }
  }
  for (const [ki, kj] of cols) for (const [i, j] of cols) if (R[id(i, j)][id(ki, kj)])
    for (const [a, b] of cols) if (R[id(ki, kj)][id(a, b)]) R[id(i, j)][id(a, b)] = true;
  for (let x = 0; x < cols.length; x++) for (let y = x + 1; y < cols.length; y++) {
    const u = id(cols[x][0], cols[x][1]), v = id(cols[y][0], cols[y][1]);
    if (!R[u][v] && !R[v][u]) return false;
  }
  // The rear stack only counts once LamBert hops back onto it, so some column must be able to reach it
  return cols.some(([i, j]) => (i || j) && R[id(i, j)][0]);
}
// ---- Monsters: red balls, and Wolfy in a badly made sheep costume (a woolly ball) ----
const ENEMY_HOP = 0.25;      // seconds a monster hop takes
const COSTUME_CHANCE = 0.2, COSTUME_BOOST = 0.2;   // chance of a costume ball, plus this much more for every red ball since the last costume
let redsSinceCostume = 0;
const GROWL_LEAD = 1.1;   // the growl clip is about 1.1 s long, so it starts this long before the costume pops (the shaking lasts 1.5 s)
const POP_TIME = 0.45;   // seconds the wool puffs fly when Wolfy's costume comes off
const BALL_REST = 0.35, WOLFY_REST = 0.25;   // pause after each landing, in seconds
const STRANDED_EXTRA_HOPS = 7;   // a stranded Wolfy hops (the number of columns he is confined to + this many) more times, then jumps to his doom
const SPAWN_EVERY = 4;       // seconds between new balls
const MAX_ENEMIES = 3;
const WOLFY_MAX_UP = 1;      // highest hop up that Wolfy can make (LamBert's limit is 1)
let enemies = [], spawnT = 3;
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]], FWD = [[1, 0], [0, 1]];   // FWD = toward the viewer

// Can a creature on column (i,j) hop by (di,dj) onto a cube column, hopping up at most `up`?
function legal(i, j, di, dj, up) {
  const a = i + di, b = j + dj;
  return a >= 0 && b >= 0 && a < N && b < N && h[a][b] > 0 && h[a][b] - h[i][j] <= up;
}

function hopTo(e, d) {
  if (d[0] || d[1]) e.face = {away: d[0] < 0 || d[1] < 0, right: d[1] < 0 || d[0] > 0};   // he turns to face the way he hops
  e.hp = {fi: e.i, fj: e.j, ti: e.i + d[0], tj: e.j + d[1], ok: legal(e.i, e.j, d[0], d[1], 99), t: 0};
}

function spawn() {
  const opts = FWD.filter(m => legal(0, 0, m[0], m[1], 99));
  if (!opts.length) return;
  const d = opts[Math.random() * opts.length | 0];
  const eligible = !enemies.some(e => e.kind !== 'red');   // only one costume ball or Wolfy at a time
  let kind = 'red';
  if (eligible) {   // the chance of a costume grows with every red ball since the last one, so the wait is never long
    if (Math.random() < COSTUME_CHANCE + COSTUME_BOOST * redsSinceCostume) { kind = 'costume'; redsSinceCostume = 0; }
    else redsSinceCostume++;
  }
  // the ball drops in a straight line from the top of the screen onto a column beside the rear stack
  enemies.push({kind, i: d[0], j: d[1], hp: null, fall: null, wait: 0,
                drop: {y: P(d[0] + .5, d[1] + .5, h[d[0]][d[1]])[1] + 60, v: 0}});
}

// Wolfy takes the first step of a shortest route to LamBert that obeys Wolfy's own hop rules
function chase(e) {
  // While LamBert rides a balloon, Wolfy blindly keeps chasing the spot LamBert jumped from
  const lure = ride && ride.phase === 0, gi = lure ? ride.d.i : pi, gj = lure ? ride.d.j : pj;
  const first = new Map([[e.i * N + e.j, null]]), q = [[e.i, e.j]];
  for (let n = 0; n < q.length; n++) {
    const [i, j] = q[n];
    for (const d of DIRS) if (legal(i, j, d[0], d[1], WOLFY_MAX_UP)) {
      const a = i + d[0], b = j + d[1], k = a * N + b;
      if (first.has(k)) continue;
      first.set(k, first.get(i * N + j) || d);
      if (a === gi && b === gj) return first.get(k);
      q.push([a, b]);
    }
  }
  const opts = DIRS.filter(d => legal(e.i, e.j, d[0], d[1], WOLFY_MAX_UP));   // can't reach him: wander
  return opts.length ? opts[Math.random() * opts.length | 0] : null;
}

// Every column Wolfy can still get to from (i0, j0), following his own hop rules (the starting column included).
// Columns are numbered i * N + j, so the rear-most column (0, 0) is number 0.
function reachableFrom(i0, j0) {
  const seen = new Set([i0 * N + j0]), q = [[i0, j0]];
  for (let n = 0; n < q.length; n++) {
    const [i, j] = q[n];
    for (const d of DIRS) if (legal(i, j, d[0], d[1], WOLFY_MAX_UP)) {
      const k = (i + d[0]) * N + j + d[1];
      if (!seen.has(k)) { seen.add(k); q.push([i + d[0], j + d[1]]); }
    }
  }
  return seen;
}

// Where a stranded Wolfy hops when his time is up: off the edge of the structure if he is next to one,
// otherwise one step toward the viewer (those steps are never too high), until he reaches an edge.
function doomedHop(e) {
  const edge = DIRS.filter(d => { const a = e.i + d[0], b = e.j + d[1]; return a < 0 || b < 0 || a >= N || b >= N || h[a][b] === 0; });
  if (edge.length) return edge[Math.random() * edge.length | 0];
  const fwd = FWD.filter(m => legal(e.i, e.j, m[0], m[1], 99));
  return fwd[Math.random() * fwd.length | 0];
}

function decide(e) {
  let d;
  if (e.kind === 'wolfy') {
    if (ride && ride.phase === 0 && e.i === ride.d.i && e.j === ride.d.j) {   // blindly follows LamBert off the edge
      addScore(LURE_POINTS); hopTo(e, ride.d.dir); return;
    }
    const reach = reachableFrom(e.i, e.j);   // every column he can get to from here
    const goal = ride && ride.phase === 0 ? ride.d : {i: pi, j: pj};   // the column he is chasing (same goal as chase())
    if (!reach.has(goal.i * N + goal.j)) {   // stranded: he cannot get to LamBert
      if (e.hopsLeft === undefined) e.hopsLeft = reach.size + STRANDED_EXTRA_HOPS;   // columns he is confined to, plus 7
      if (e.hopsLeft-- <= 0) { hopTo(e, doomedHop(e)); return; }   // time is up: he jumps to his doom
    } else e.hopsLeft = undefined;   // LamBert is reachable (again): he stops heading for the edge and gives chase
    d = chase(e);
    if (!d) d = [0, 0];   // no hop available at all (a single column): hop in place, looking frustrated
  } else {
    const opts = FWD.filter(m => legal(e.i, e.j, m[0], m[1], 99));
    d = opts.length ? opts[Math.random() * opts.length | 0] : FWD[Math.random() * 2 | 0];   // no way on: hop off the edge
  }
  if (d) hopTo(e, d); else e.wait = .3;
}

// LamBert and a monster hopping toward each other's spots meet in mid-air, and he dies
function checkSwap() {
  if (!hop || hop.balloon || !hop.ok) return;
  for (const e of enemies) {
    const m = e.hp;
    if (m && m.ok && m.fi === hop.ti && m.fj === hop.tj && m.ti === hop.fi && m.tj === hop.fj && m.t + hop.t >= 1) { die(); return; }
  }
}

// ---- Scoring: points, and an extra life at 8,000 points and then every 14,000 more ----
const GRASS_POINTS = 25, LEVEL_POINTS = 1000, LURE_POINTS = 500;   // per patch eaten; per level cleared; for luring Wolfy off the edge
const EXTRA_LIFE_FIRST = 8000, EXTRA_LIFE_EVERY = 14000;
let nextExtraLife = EXTRA_LIFE_FIRST, notice = '', noticeT = 0;   // noticeT = seconds left to show the 'Extra life!' message
function addScore(points) {
  score += points;
  while (score >= nextExtraLife) { lives++; nextExtraLife += EXTRA_LIFE_EVERY; notice = 'Extra life!'; noticeT = 1.5; sound('extralife'); }
}
// ---- High scores: the best 10, each with a name, kept in this browser's localStorage (see section 4 of the comment) ----
const SCORES_KEY = 'lambert-scores', NAME_KEY = 'lambert-name', MAX_SCORES = 10, NAME_MAX = 12;
const nameBox = document.getElementById('nameBox'), nameInput = document.getElementById('nameInput');
let highScores = [];       // best first: {name, score, level}
let entering = false;      // true while the player is typing a name (the game's keys and taps are off)
let lastRank = -1;         // row of the table to highlight: the score just entered
let overT = 0;             // seconds before Game over can be dismissed, so a stray tap or key does not restart at once
function loadScores() {
  try {
    const a = JSON.parse(localStorage.getItem(SCORES_KEY));
    if (Array.isArray(a)) return a.filter(e => e && typeof e.name === 'string' && typeof e.score === 'number').slice(0, MAX_SCORES);
  } catch (err) {}
  return [];
}
function qualifies(sc) { return sc > 0 && (highScores.length < MAX_SCORES || sc > highScores[highScores.length - 1].score); }
function endGame() {       // called when the last life is lost
  over = true; overT = 1; lastRank = -1;
  highScores = loadScores();   // read again: another tab may have added scores
  if (qualifies(score)) {
    entering = true;
    document.getElementById('nameScore').textContent = 'Score ' + score.toLocaleString('en-US');
    try { nameInput.value = localStorage.getItem(NAME_KEY) || ''; } catch (err) { nameInput.value = ''; }
    nameBox.hidden = false; nameInput.focus(); nameInput.select();   // (an iPhone keyboard only opens when the player taps the box)
  }
}
function submitName() {
  if (!entering) return;
  const name = nameInput.value.trim().slice(0, NAME_MAX) || 'Anonymous';
  let at = highScores.findIndex(e => score > e.score);   // a tie goes below the older score
  if (at < 0) at = highScores.length;
  highScores.splice(at, 0, {name: name, score: score, level: level});
  highScores = highScores.slice(0, MAX_SCORES); lastRank = at;
  try { localStorage.setItem(SCORES_KEY, JSON.stringify(highScores)); localStorage.setItem(NAME_KEY, name); } catch (err) {}
  entering = false; overT = .8; nameBox.hidden = true; nameInput.blur();
}
document.getElementById('nameOk').addEventListener('click', submitName);
highScores = loadScores();

function startNewGame() {   // after Game over
  over = false; score = 0; lives = LIVES; level = 1; nextExtraLife = EXTRA_LIFE_FIRST; noticeT = 0;
  newLevel();
}

const DEATH_PAUSE = 0.5;   // seconds everything freezes after LamBert is hit
let dying = 0;
function die() {
  if (dying > 0) return;
  dying = DEATH_PAUSE; lives--; sound('death');
}

function arrived(e) {
  e.wait = e.kind === 'wolfy' ? WOLFY_REST : BALL_REST;
  sound(e.kind === 'wolfy' ? 'wolfstep' : 'bounce');   // balls bounce very quietly: there are many of them
  if (e.kind === 'costume' && !FWD.some(m => legal(e.i, e.j, m[0], m[1], 99))) e.hatch = 1.5;   // at the bottom it sits and shakes for 1.5 seconds, then the costume pops off
  if (e.i === pi && e.j === pj && !hop && !fall && !ride) die();
}

function updateEnemies(dt) {
  if (pause || over) return;
  spawnT -= dt;
  if (spawnT <= 0) { if (enemies.length < MAX_ENEMIES) spawn(); spawnT = SPAWN_EVERY; }
  const cur = enemies;
  for (const e of cur) {
    if (cur !== enemies) break;   // LamBert was just hit
    if (e.pop > 0) e.pop -= dt;
    if (e.drop) {
      e.drop.v += 3000 * dt; e.drop.y -= e.drop.v * dt;
      if (e.drop.y <= 0) { e.drop = null; arrived(e); }
    } else if (e.fall) {
      e.fall.v += 2400 * dt; e.fall.y += e.fall.v * dt;
      if (e.fall.y > H + 60) e.dead = true;
    } else if (e.hp) {
      e.hp.t += dt / ENEMY_HOP;
      if (e.hp.t >= 1) {
        if (e.hp.ok) { e.i = e.hp.ti; e.j = e.hp.tj; e.hp = null; arrived(e); }
        else { const p = hopPos(e.hp, 1); e.fall = {x: p[0], y: p[1], v: 0, back: e.hp.ti < 0 || e.hp.tj < 0}; e.hp = null; if (e.kind === 'wolfy') sound('yelp'); }
      }
    } else if (e.hatch > 0) {
      e.hatch -= dt;
      if (!e.growled && e.hatch <= GROWL_LEAD) { e.growled = true; sound('growl'); }   // the growl ends just as the costume pops
      if (e.hatch <= 0) { e.kind = 'wolfy'; e.wait = WOLFY_REST; e.pop = POP_TIME; }   // the costume pops (the growl has just ended; there is no howl)
    } else if ((e.wait -= dt) <= 0) decide(e);
  }
  if (cur === enemies) enemies = enemies.filter(e => !e.dead);
}

function enemyPos(e) {
  if (e.drop) { const p = P(e.i + .5, e.j + .5, h[e.i][e.j]); return [p[0], p[1] - e.drop.y]; }
  if (e.fall) return [e.fall.x, e.fall.y];
  if (e.hp) return hopPos(e.hp, Math.min(1, e.hp.t));
  return P(e.i + .5, e.j + .5, h[e.i][e.j]);
}

// A monster that has gone out through a rear wall is behind the cube structure, so the cubes hide it
function behindWall(e) {
  return !!((e.fall && e.fall.back) || (e.hp && !e.hp.ok && (e.hp.ti < 0 || e.hp.tj < 0) && e.hp.t >= .5));
}

// ---- Wolfy: a gray wolf who turns to face the way he hops ----
function drawWolfy(x, y, e) {   // (x, y) is the point where his feet touch
  const f = e.face || {away: false, right: true}, dx = f.right ? 1 : -1, away = f.away;
  const r = A * .5, FUR = '#7d8590', DARKF = '#4b525b', LIGHT = '#dfe3e8', PINK = '#e8a0ae';
  let stretch = 0, lean = 0;
  if (e.hp) { const t = Math.min(1, e.hp.t); stretch = .16 * Math.sin(Math.PI * t); lean = Math.cos(Math.PI * t); }
  g.save(); g.translate(x, y); g.scale(1 - stretch * .6, 1 + stretch);
  g.fillStyle = DARKF;   // legs
  for (const s of [-1, 1]) { g.beginPath(); g.ellipse(s * r * .28 + dx * r * .08, -r * .38, r * .1, r * .38, 0, 0, 7); g.fill(); }   // long thin legs
  const by = -r * 1.15;   // centre of the body
  const body = () => {
    g.beginPath(); g.ellipse(0, by, r * .58, r * .95, 0, 0, 7); g.fillStyle = FUR; g.fill();
    if (!away) { g.beginPath(); g.ellipse(dx * r * .1, by + r * .2, r * .3, r * .6, 0, 0, 7); g.fillStyle = LIGHT; g.fill(); }   // narrow pale belly
  };
  const tail = () => {   // bushy tail with a pale tip
    g.save(); g.translate(away ? dx * r * .1 : -dx * r * .6, away ? by + r * .55 : by + r * .15); g.rotate(away ? 0 : -dx * .7);
    const tip = away ? 1 : -1;
    g.beginPath(); g.ellipse(0, 0, r * .17, r * .55, 0, 0, 7); g.fillStyle = FUR; g.fill();
    g.beginPath(); g.ellipse(0, tip * r * .38, r * .15, r * .2, 0, 0, 7); g.fillStyle = LIGHT; g.fill();
    g.restore();
  };
  const hx = dx * r * .22, hy = by - r * (away ? .95 : .6), hr = r * .55;   // head (higher on screen when seen from behind)
  const head = () => {
    for (const s of [-1, 1]) {   // pointed ears
      const ex = hx + s * hr * .6, ey = hy - hr * .55;
      g.beginPath(); g.moveTo(ex - hr * .26, ey + hr * .3); g.lineTo(ex + s * hr * .1 + lean * s * hr * .08, ey - hr * 1.15); g.lineTo(ex + hr * .26, ey + hr * .3); g.closePath();
      g.fillStyle = FUR; g.fill();
      if (!away) { g.beginPath(); g.moveTo(ex - hr * .16, ey + hr * .25); g.lineTo(ex + s * hr * .08, ey - hr * .7); g.lineTo(ex + hr * .16, ey + hr * .25); g.closePath(); g.fillStyle = PINK; g.fill(); }
    }
    blob(hx, hy, hr, FUR);
    if (!away) {
      g.beginPath(); g.ellipse(hx + dx * hr * .55, hy + hr * .3, hr * .68, hr * .26, 0, 0, 7); g.fillStyle = LIGHT; g.fill();   // long snout
      blob(hx + dx * hr * 1.15, hy + hr * .22, hr * .11, '#1b1620');   // nose
      g.beginPath(); g.ellipse(hx + dx * hr * .8, hy + hr * .62, hr * .1, hr * .22, 0, 0, 7); g.fillStyle = PINK; g.fill();   // tongue hanging out: he is hungry
      g.beginPath(); g.moveTo(hx + dx * hr * .95, hy + hr * .5); g.lineTo(hx + dx * hr * 1.05, hy + hr * .75); g.lineTo(hx + dx * hr * 1.13, hy + hr * .5); g.closePath(); g.fillStyle = '#ffffff'; g.fill();   // fang
      const ex = hx + dx * hr * .15;
      g.strokeStyle = DARKF; g.lineWidth = Math.max(1.5, hr * .12);
      for (const s of [-1, 1]) {
        const X = ex + s * hr * .38, Y = hy - hr * .15;
        g.beginPath(); g.ellipse(X, Y, hr * .2, hr * .12, 0, 0, 7); g.fillStyle = '#ffd23f'; g.fill(); blob(X + dx * hr * .05, Y, hr * .07, '#1b1620');   // narrow eye
        g.beginPath(); g.moveTo(X - s * hr * .24, Y - hr * .08); g.lineTo(X + s * hr * .24, Y - hr * .32); g.stroke();   // slanted brow
      }
    }
  };
  if (away) { head(); body(); tail(); } else { tail(); body(); head(); }   // from behind the body is nearer than the head
  g.restore();
}

// Wolfy's "sheep costume": a lumpy ball of wool with crooked ears and two mismatched eyes stuck on.
// It shakes harder and harder just before it pops off.
function drawCostume(x, y, e) {   // (x, y) is the point where it touches the cube
  const r = A * .3;
  let ox = 0, rot = 0;
  if (e.hatch > 0) { const k = 1 - e.hatch / 1.5, t = performance.now(); ox = Math.sin(t / 18) * (1 + 3 * k); rot = Math.sin(t / 23) * .12 * k; }
  g.save(); g.translate(x + ox, y - r * .95); g.rotate(rot);
  // ears stuck on crookedly, behind the wool: different sizes, colors and angles (side 1 = droops, -1 = sticks up)
  for (const [ex, ey, rx, ry, ang, side, col] of [[-1.0, -.1, .26, .5, .6, 1, '#4a3f48'], [.95, -.6, .2, .4, .5, -1, '#6e5f6a']]) {
    g.save(); g.translate(ex * r, ey * r); g.rotate(ang);
    g.beginPath(); g.ellipse(0, side * ry * r * .6, rx * r, ry * r, 0, 0, 7); g.fillStyle = col; g.fill();
    if (side > 0) { g.beginPath(); g.ellipse(0, side * ry * r * .6, rx * r * .45, ry * r * .65, 0, 0, 7); g.fillStyle = '#e9a3b5'; g.fill(); }
    g.restore();
  }
  for (const [px, py, pr] of [[-.55, .25, .55], [.55, .2, .55], [-.35, -.5, .55], [.4, -.55, .5], [0, .5, .55], [0, 0, .9]]) blob(px * r, py * r, pr * r, '#ffffff', '#c9c2d0');   // lumpy wool
  const eye = (ex, ey, er, px, py) => { blob(ex * r, ey * r, er * r, '#ffffff', '#8a8394'); blob((ex + px) * r, (ey + py) * r, er * r * .5, '#1b1620'); };
  eye(-.32, -.15, .3, .08, .06);   // two mismatched eyes: different sizes and heights, looking different ways
  eye(.28, -.3, .2, -.05, .05);
  blob(-.02 * r, .14 * r, .1 * r, '#e58aa0');   // a nose, not quite in the middle
  g.restore();
}

function drawWoolPuffs(x, y, left) {   // wool flying off when the costume pops; left = 1 at the pop, 0 when the puffs are gone
  const u = 1 - left, r = A * .3;
  g.save(); g.globalAlpha = Math.max(0, 1 - u * u);
  for (let n = 0; n < 8; n++) {
    const a = n * Math.PI / 4 + .3, d = r * (.5 + 2.4 * u);
    blob(x + Math.cos(a) * d, y + Math.sin(a) * d * .8 - u * r, r * .32 * (1 - .6 * u), '#ffffff', '#c9c2d0');
  }
  g.restore();
}

// A red ball: shiny, and it stretches in the air and squashes when it lands, like a real bouncing ball
function drawRedBall(x, y, e) {   // (x, y) is the point where it touches the cube
  const R = A * .324;
  let stretch = 0, squash = 0;
  if (e.drop) stretch = .2;                                   // falling in from the top of the screen
  else if (e.fall) stretch = .15;                             // falling off the edge
  else if (e.hp) { const t = Math.min(1, e.hp.t); stretch = .2 * Math.sin(Math.PI * t); if (t > .85) squash = (t - .85) / .15 * .3; }
  else if (e.wait > 0) squash = .3 * Math.min(1, e.wait / BALL_REST);   // flattened just after landing, then springs back
  g.save(); g.translate(x, y); g.scale(1 - stretch * .45 + squash * .5, 1 + stretch - squash);
  const grad = g.createRadialGradient(-R * .35, -R * 1.35, R * .1, 0, -R, R * 1.05);   // light from the upper left
  grad.addColorStop(0, '#ff9a9a'); grad.addColorStop(.45, '#e63946'); grad.addColorStop(1, '#9d1c2b');
  g.beginPath(); g.arc(0, -R, R, 0, 7); g.fillStyle = grad; g.fill();
  g.beginPath(); g.ellipse(-R * .35, -R * 1.4, R * .22, R * .13, -.6, 0, 7); g.fillStyle = 'rgba(255,255,255,.75)'; g.fill();   // shiny spot
  g.restore();
}

function drawEnemy(e) {
  const p = enemyPos(e);
  if (e.kind === 'wolfy') { drawWolfy(p[0], p[1], e); if (e.pop > 0) drawWoolPuffs(p[0], p[1] - A * .4, e.pop / POP_TIME); return; }
  if (e.kind === 'costume') { drawCostume(p[0], p[1], e); return; }
  drawRedBall(p[0], p[1], e);
}

// ---- Balloons: one beside each back edge, each usable once per level ----
// Hopping through the rear wall from the right column makes LamBert grab the balloon's string.
// The balloon carries him over the rear-most stack, pops, and he drops onto it.
// Chance of a column is proportional to its distance k from the rear stack, so longer rides are likelier
function pickFar(list) {
  let r = Math.random() * list.reduce((a, k) => a + k, 0);
  for (const k of list) { r -= k; if (r < 0) return k; }
  return list[list.length - 1];
}

function makeBalloons() {
  balloons = [];
  const left = [], right = [];
  for (let k = 1; k < N; k++) { if (h[0][k] > 0) left.push(k); if (h[k][0] > 0) right.push(k); }
  if (left.length) balloons.push({i: 0, j: pickFar(left), dir: [-1, 0], color: '#ffd84a', dark: '#d99a00'});    // yellow; reached by hopping up-left
  if (right.length) balloons.push({i: pickFar(right), j: 0, dir: [0, -1], color: '#ff8fc0', dark: '#d6407f'});  // pink; reached by hopping up-right
}

function balloonPos(d) {   // where LamBert's feet are while he hangs on this balloon's string
  return P(d.i + d.dir[0] + .5, d.j + d.dir[1] + .5, h[d.i][d.j] + BALLOON_LIFT);
}

function startRide(d) {
  pi = 0; pj = 0; queued = null; rest = 0;
  facing = {away: false, right: true};
  const from = balloonPos(d), r0 = P(.5, .5, h[0][0]);
  const minY = A * (BALLOON_HANG + BALLOON_STRING + .35 * BALLOON_R);   // lets the top third of the balloon float off the top of the screen over a tall rear stack
  const mid = [from[0], Math.min(from[1], Math.max(from[1] - A, minY))];   // straight up one cube-height
  const top = [r0[0], Math.max(r0[1] - A * RIDE_TOP, minY)];   // then across to RIDE_TOP cube-heights above the rear stack
  const len1 = from[1] - mid[1], len2 = Math.hypot(top[0] - mid[0], top[1] - mid[1]);
  ride = {d, t: 0, phase: 0, from, mid, top, len1, len2, drop: r0[1] - top[1], y: 0, v: 0, dur: Math.max(.3, (len1 + len2) / (RIDE_SPEED * A))};   // constant speed: longer ride, longer time
}

function ridePos() {
  const r0 = P(.5, .5, h[0][0]);
  if (ride.phase === 1) return [r0[0], r0[1] - ride.y];   // dropping onto the rear stack
  // Constant speed along the whole path (straight up, then straight across), with no pause at the corner
  const t = Math.min(1, ride.t), s = t * (ride.len1 + ride.len2);
  const lerp = (a, b, u) => [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u];
  return s < ride.len1 ? lerp(ride.from, ride.mid, s / (ride.len1 || 1)) : lerp(ride.mid, ride.top, (s - ride.len1) / (ride.len2 || 1));
}

function updateRide(dt) {
  if (ride.phase === 0) {
    ride.t += dt / ride.dur;
    if (ride.t >= 1) {   // the balloon pops, and LamBert drops onto the rear stack
      const f = ridePos();
      pops.push({x: f[0], y: f[1] - A * (BALLOON_HANG + BALLOON_STRING), t: 0, color: ride.d.color});
      sound('pop');
      ride.phase = 1; ride.y = ride.drop; ride.v = 0; balloons = balloons.filter(x => x !== ride.d);
    }
  } else {
    ride.v += 3000 * dt; ride.y -= ride.v * dt;
    if (ride.y <= 0) { ride = null; rest = LAMBERT_REST; landed(); }
  }
}

// A balloon on a string. F is where LamBert's feet are (or will be) while he hangs on; sway is a gentle bob in pixels.
function drawBalloon(F, d, sway, tail) {   // tail = extra string length (pixels) hanging below his grip, until he grabs on
  const hx = F[0] + sway * .5, hy = F[1] - A * BALLOON_HANG;                        // the end of the string, where his front legs grip it
  const cx = F[0] + sway, R = A * BALLOON_R, cy = hy - A * BALLOON_STRING + sway * .4;   // centre of the balloon
  g.strokeStyle = '#6b6272'; g.lineWidth = 1.5;   // the string, with a little curve
  const ey = hy + tail;   // before he grabs it, the string hangs lower than his grip
  g.beginPath(); g.moveTo(cx, cy + R * 1.28); g.quadraticCurveTo(cx + R * .3, (cy + R * 1.28 + ey) / 2, hx, ey); g.stroke();
  const grad = g.createRadialGradient(cx - R * .35, cy - R * .4, R * .1, cx, cy, R * 1.1);
  grad.addColorStop(0, '#ffffff'); grad.addColorStop(.25, d.color); grad.addColorStop(1, d.dark);
  g.beginPath(); g.ellipse(cx, cy, R * .9, R * 1.05, 0, 0, 7); g.fillStyle = grad; g.fill();
  g.beginPath(); g.moveTo(cx, cy + R * 1.04); g.lineTo(cx - R * .14, cy + R * 1.28); g.lineTo(cx + R * .14, cy + R * 1.28); g.closePath(); g.fillStyle = d.dark; g.fill();   // knot
  g.beginPath(); g.ellipse(cx - R * .35, cy - R * .45, R * .18, R * .3, .5, 0, 7); g.fillStyle = 'rgba(255,255,255,.6)'; g.fill();   // shiny spot
}

function drawPops() {   // bits of a burst balloon flying outward
  for (const p of pops) {
    const u = p.t / .4;
    g.save(); g.globalAlpha = Math.max(0, 1 - u); g.fillStyle = p.color;
    for (let n = 0; n < 10; n++) { const a = n * Math.PI / 5 + .2, dd = A * (.25 + .9 * u); g.beginPath(); g.arc(p.x + Math.cos(a) * dd, p.y + Math.sin(a) * dd, A * .07 * (1 - .5 * u), 0, 7); g.fill(); }
    g.strokeStyle = '#ffffff'; g.lineWidth = 2; g.beginPath(); g.arc(p.x, p.y, A * (.3 + .6 * u), 0, 7); g.stroke();
    g.restore();
  }
}

function newLevel() { do { gen(); } while (!solvable()); levelSeed = Math.random() * 1000; makeBalloons(); makeCracks(); pops = []; enemies = []; spawnT = 3; place(); pause = false; }

const LAMBERT_HOP = 0.2, LAMBERT_REST = 0.2;   // hop time and pause after landing, in seconds
let rest = 0, queued = null, ride = null, balloons = [];
let bump = null;   // a little hop in place when he tries to hop too high: {t: 0 to 1, di, dj}
const BUMP_TIME = 0.18;
const BALLOON_LIFT = 1 / 4;   // the string's end hangs this far (in cubes) above the column top, so LamBert leaps up a little to grab it
const BALLOON_TAIL = 0.8;   // before he grabs it, the string hangs this much (in cube-heights) lower than his grip, so it clearly points at the column to jump from
const BALLOON_HANG = 0.94, BALLOON_STRING = 0.85, BALLOON_R = 0.42;   // in cube-heights: his grip above his feet; balloon centre above his grip; balloon radius
const RIDE_SPEED = 4.7, RIDE_TOP = 1.5;   // ride speed in cube-heights per second; RIDE_TOP = how many cube-heights above the rear stack his feet end up
let pops = [];   // balloons that have burst
function move(di, dj) {
  if (fall || pause || over || dying > 0 || ride) return;
  if (hop || rest > 0) { queued = [di, dj]; return; }   // remember one swipe or key press
  const ni = pi + di, nj = pj + dj;
  const ok = ni >= 0 && nj >= 0 && ni < N && nj < N && h[ni][nj] > 0;
  if (ok && h[ni][nj] - h[pi][pj] >= 2) {   // too high to hop up: he makes a little hop in place, so the player sees he tried
    bump = {t: 0, di, dj}; facing = {away: di < 0 || dj < 0, right: dj < 0 || di > 0}; sound('blocked');
    return;
  }
  const balloon = balloons.find(d => d.i === pi && d.j === pj && d.dir[0] === di && d.dir[1] === dj);
  hop = {fi: pi, fj: pj, ti: ni, tj: nj, ok, t: 0, balloon, back: !balloon && (ni < 0 || nj < 0)};
  facing = {away: di < 0 || dj < 0, right: dj < 0 || di > 0};   // he turns to face the way he hops
  sound('hop');
}

function hopPos(p, t) {
  const hf = h[p.fi][p.fj], ht = p.ok ? h[p.ti][p.tj] : hf;
  const a = P(p.fi + .5, p.fj + .5, hf), b = p.balloon ? balloonPos(p.balloon) : P(p.ti + .5, p.tj + .5, ht);
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t - Math.sin(Math.PI * t) * A * .6];
}

function landed() {
  if (enemies.some(e => !e.hp && !e.fall && !e.drop && e.i === pi && e.j === pj)) { die(); return; }
  if (!seen[pi][pj]) { seen[pi][pj] = true; addScore(GRASS_POINTS); }
  if (seen.every((r, i) => r.every((s, j) => s || h[i][j] === 0))) {
    addScore(LEVEL_POINTS); pause = true; msg = 'Level clear!'; sound('clear');
    setTimeout(() => { level++; msg = ''; newLevel(); }, 1300);
  }
}

function update(dt) {
  for (const p of pops) p.t += dt;
  if (noticeT > 0) noticeT -= dt;
  if (bump) { bump.t += dt / BUMP_TIME; if (bump.t >= 1) bump = null; }
  pops = pops.filter(p => p.t < .4);
  if (dying > 0) {   // frozen for a moment after being hit, then the next life starts
    dying -= dt;
    if (dying <= 0) { dying = 0; enemies = []; spawnT = 3; if (lives <= 0) endGame(); else place(); }
    return;
  }
  updateEnemies(dt);
  checkSwap();
  if (ride) { updateRide(dt); return; }
  if (rest > 0) { rest -= dt; if (rest <= 0 && queued) { const q = queued; queued = null; move(q[0], q[1]); } }
  if (hop) {
    hop.t += dt / LAMBERT_HOP;
    if (hop.t >= 1) {
      if (hop.balloon) { startRide(hop.balloon); hop = null; sound('grab'); }
      else if (hop.ok) { pi = hop.ti; pj = hop.tj; hop = null; rest = LAMBERT_REST; landed(); }
      else { const p = hopPos(hop, 1); fall = {x: p[0], y: p[1], v: 0, back: hop.back}; hop = null; sound('fall'); }
    }
  } else if (fall) {
    fall.v += 2400 * dt; fall.y += fall.v * dt;
    if (fall.y > H + 60) { fall = null; lives--; if (lives <= 0) endGame(); else place(); }
  }
}

function poly(pts, fill) {
  g.beginPath();
  pts.forEach((p, n) => n ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
  g.closePath(); g.fillStyle = fill; g.fill(); g.stroke();
}

// ---- Meadow look: grass-topped rock columns floating in a pale blue sky ----
const GRASS = '#62d24a', EATEN = '#a39657', OUTLINE = '#3d4650';
// How the grass is drawn. 'tufts' (the current look): the flat green top gets small tufts of grass blades, and an eaten
// patch keeps only a few short khaki stubs. 'flat' is the ORIGINAL look, kept in case the owner wants it back: a plain
// bright green top face (GRASS) with its thin dark outline, about 1 in 6 uneaten tops with a small white daisy, and eaten
// tops plain khaki (EATEN), with no blades at all.
const GRASS_STYLE = 'tufts';
const TUFTS_PER_PATCH = 18;   // tufts of grass on each uneaten patch (it was 9; doubled at the owner's request)
const GRASS_MARGIN = 0.04;   // how close to the edge of a patch the tufts may grow, as a fraction of its width (it was 0.12, which left a bare border; 0 = right up to the edge)
const BLADE_COLORS = ['#3f9a35', '#4fb83f', '#8be36a'];   // dark, medium, light green blades
const STUBBLE_COLORS = ['#8c8140', '#b5a860'];            // short blades left on an eaten patch
let levelSeed = 0;   // changes every level, so flowers, rock shades and cracks differ from level to level
const hh = (i, j, k, s) => { const x = Math.sin(i * 127.1 + j * 311.7 + k * 74.7 + s * 19.3 + levelSeed * 53.1) * 43758.5453; return x - Math.floor(x); };   // repeatable "random" number, 0 to 1

const SKY = g.createLinearGradient(0, 0, 0, H);
SKY.addColorStop(0, '#8cc6f2'); SKY.addColorStop(1, '#b9dcf7');
function cloud(x, y, s) {
  g.fillStyle = 'rgba(255,255,255,.92)';
  for (const [dx, dy, r] of [[-28, 6, 18], [-8, -6, 24], [18, -2, 21], [38, 8, 15], [4, 12, 20]]) {
    g.beginPath(); g.arc(x + dx * s, y + dy * s, r * s, 0, 7); g.fill();
  }
}
function drawSky() {
  g.fillStyle = SKY; g.fillRect(0, 0, W, H);
  cloud(W * .2, 170, 1); cloud(W * .82, 250, 1.15);   // two still clouds (the cube structure may partly cover them)
}

// A point on a face given three of its corners: a = bottom-left, b = bottom-right, d = top-left
function face(a, b, d, u, v) { return [a[0] + (b[0] - a[0]) * u + (d[0] - a[0]) * v, a[1] + (b[1] - a[1]) * u + (d[1] - a[1]) * v]; }
let cracks = new Set();
function makeCracks() {   // 2 or 3 cracks on the whole rock structure, always on faces you can see
  const faces = [];
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) for (let k = 0; k < N; k++) if (c[i][j][k]) {
    if (i + 1 >= N || !c[i + 1][j][k]) faces.push(i + ',' + j + ',' + k + ',R');
    if (j + 1 >= N || !c[i][j + 1][k]) faces.push(i + ',' + j + ',' + k + ',L');
  }
  cracks = new Set();
  for (let n = 2 + (Math.random() < .5 ? 1 : 0); n > 0 && faces.length; n--) cracks.add(faces.splice(Math.random() * faces.length | 0, 1)[0]);
}

function crack(a, b, d, s) {   // a thin crack across a rock face
  if (s > .6) return;
  const u = .2 + s;
  g.beginPath();
  let p = face(a, b, d, u, 1); g.moveTo(p[0], p[1]);
  p = face(a, b, d, u + .12, .62); g.lineTo(p[0], p[1]);
  p = face(a, b, d, u - .06, .35); g.lineTo(p[0], p[1]);
  g.strokeStyle = 'rgba(30,35,45,.35)'; g.stroke();
  g.strokeStyle = OUTLINE;
}
function tufts(i, j, z, eaten) {   // little tufts of grass blades on top of the column at (i, j); z is the height of the top face
  const n = eaten ? 5 : TUFTS_PER_PATCH;
  g.lineCap = 'round';
  for (let t = 0; t < n; t++) {
    const base = P(i + GRASS_MARGIN + (1 - 2 * GRASS_MARGIN) * hh(i, j, 0, 10 + t * 3), j + GRASS_MARGIN + (1 - 2 * GRASS_MARGIN) * hh(i, j, 0, 11 + t * 3), z);
    const blades = eaten ? 3 : (hh(i, j, 0, 12 + t * 3) > .5 ? 4 : 3);
    for (let b = 0; b < blades; b++) {
      const lean = (b - (blades - 1) / 2) * A * .05 + (hh(i, j, t, 20 + b) - .5) * A * .05;   // blades fan out a little
      const ht = A * (eaten ? .04 + .04 * hh(i, j, t, 30 + b) : .16 + .17 * hh(i, j, t, 30 + b));
      g.strokeStyle = eaten ? STUBBLE_COLORS[(b + t) % 2] : BLADE_COLORS[(b + t) % 3];
      g.lineWidth = eaten ? 1 : 1.7;
      g.beginPath(); g.moveTo(base[0] + lean * .3, base[1]);
      g.quadraticCurveTo(base[0] + lean * .8, base[1] - ht * .6, base[0] + lean * 1.6, base[1] - ht); g.stroke();
    }
  }
  g.lineCap = 'butt'; g.lineWidth = 1; g.strokeStyle = OUTLINE;   // put back what drawCubes() uses for the rock outlines
}
function flower(i, j, z) {   // a small daisy on an uneaten patch of grass
  const p = P(i + .3 + .4 * hh(i, j, 0, 5), j + .3 + .4 * hh(i, j, 0, 6), z), r = A * .08;
  g.fillStyle = '#fff';
  for (let n = 0; n < 5; n++) { const a = n * 1.2566; g.beginPath(); g.arc(p[0] + Math.cos(a) * r * 1.3, p[1] + Math.sin(a) * r * .7, r, 0, 7); g.fill(); }
  g.fillStyle = '#ffd23f'; g.beginPath(); g.arc(p[0], p[1], r * .75, 0, 7); g.fill();
}

function drawCubes() {
  g.lineWidth = 1; g.strokeStyle = OUTLINE;
  const list = [];
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) for (let k = 0; k < N; k++) if (c[i][j][k]) list.push([i, j, k]);
  list.sort((a, b) => (a[0] + a[1] + a[2]) - (b[0] + b[1] + b[2]));   // far to near
  for (const [i, j, k] of list) {
    const top = k === h[i][j] - 1, v = hh(i, j, k, 1) * 5 - 2.5;   // v varies each rock's shade a little
    poly([P(i, j, k + 1), P(i + 1, j, k + 1), P(i + 1, j + 1, k + 1), P(i, j + 1, k + 1)], top && seen[i][j] ? EATEN : GRASS);
    if (top && GRASS_STYLE === 'tufts') tufts(i, j, k + 1, seen[i][j]);
    if (top && !seen[i][j] && hh(i, j, 0, 3) < .17) flower(i, j, k + 1);
    poly([P(i + 1, j, k), P(i + 1, j + 1, k), P(i + 1, j + 1, k + 1), P(i + 1, j, k + 1)], `hsl(215, 9%, ${44 + v}%)`);   // right face (darker rock)
    if (cracks.has(i + ',' + j + ',' + k + ',R')) crack(P(i + 1, j, k), P(i + 1, j + 1, k), P(i + 1, j, k + 1), hh(i, j, k, 2) * .6);
    poly([P(i, j + 1, k), P(i + 1, j + 1, k), P(i + 1, j + 1, k + 1), P(i, j + 1, k + 1)], `hsl(215, 8%, ${62 + v}%)`);   // left face (lighter rock)
    if (cracks.has(i + ',' + j + ',' + k + ',L')) crack(P(i, j + 1, k), P(i + 1, j + 1, k), P(i, j + 1, k + 1), hh(i, j, k, 4) * .6);
  }
}

// ---- LamBert turns to face the way he hops ----
let facing = {away: false, right: true};   // away = hopping up the structure; right = hopping toward the right of the screen

function blob(cx, cy, r, fill, line) {   // a filled circle with an optional thin outline
  g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fillStyle = fill; g.fill();
  if (line) { g.strokeStyle = line; g.lineWidth = 1.2; g.stroke(); }
}

// ---- LamBert: a black-faced lamb (white wool, dark face, ears and legs) ----
function drawPlayer(x, y, still) {   // (x, y) is the point where his feet touch; still = standing and facing us (for the lives icons)
  const r = A * .36, dx = still || facing.right ? 1 : -1, away = !still && facing.away;
  const WOOL = '#ffffff', OUT = '#c9c2d0', DARK = '#3f343c', PINK = '#e9a3b5';
  let stretch = 0, ears = 0;   // stretch: + tall in the air, - squashed after landing; ears: + hanging down, - flying up
  if (still) ears = 0;
  else if (ride) { ears = ride.phase === 1 ? -1 : 0; if (ride.phase === 0) stretch = .08; }   // ears fly up as he drops; hanging stretches him a little
  else if (hop) { const t = Math.min(1, hop.t); stretch = .16 * Math.sin(Math.PI * t); ears = Math.cos(Math.PI * t); }
  else if (fall) ears = -1;
  else if (bump) { stretch = .16 * Math.sin(Math.PI * bump.t); ears = Math.cos(Math.PI * bump.t); }   // the little hop in place
  else if (rest > 0) { stretch = -.14 * rest / LAMBERT_REST; ears = .5 * rest / LAMBERT_REST; }
  g.save(); g.translate(x, y); g.scale(1 - stretch * .6, 1 + stretch);
  g.fillStyle = DARK;   // legs
  for (const s of [-1, 1]) { g.beginPath(); g.ellipse(s * r * .34 + dx * r * .08, -r * .3, r * .15, r * .3, 0, 0, 7); g.fill(); }
  const by = -r * .98;   // centre of the woolly body
  const drawBody = () => {
    for (const [px, py, pr] of [[-.62, .1, .5], [.62, .1, .5], [0, .35, .62], [-.45, -.4, .5], [.45, -.4, .5], [0, 0, .85]]) blob(px * r * .92, by + py * r * .92, pr * r * .92, WOOL, OUT);
    if (away) blob(dx * r * .1, by + r * .5, r * .26, '#ffffff', '#b9aebf');   // little tail, seen from behind
  };
  const hx = dx * r * .2, hy = by - r * (away ? .75 : .3), hr = r * .7;   // big round head (higher up on screen when seen from behind, since it is farther away)
  const drawHead = () => {
  for (const s of [-1, 1]) {   // ears stick out to the sides and flop with the hop
    g.save(); g.translate(hx + s * hr * .85, hy - hr * .05 + ears * r * .08);
    g.rotate(-s * (1.0 - ears * .4));
    g.beginPath(); g.ellipse(0, hr * .3, hr * .28, hr * .52, 0, 0, 7); g.fillStyle = DARK; g.fill();
    if (!away) { g.beginPath(); g.ellipse(0, hr * .3, hr * .13, hr * .34, 0, 0, 7); g.fillStyle = PINK; g.fill(); }
    g.restore();
  }
  blob(hx, hy, hr, away ? WOOL : DARK, away ? OUT : null);   // from behind you see wool, from the front a dark face
  for (const [tx, ty, tr] of [[0, -.85, .4], [-.42, -.72, .3], [.42, -.72, .3]]) blob(hx + tx * hr, hy + ty * hr, tr * hr, WOOL, OUT);   // woolly top-knot
  if (!away) {   // face
    const ex = hx + dx * hr * .12;
    for (const s of [-1, 1]) {
      blob(ex + s * hr * .38, hy - hr * .08, hr * .22, '#ffffff');                        // eye
      blob(ex + s * hr * .38 + dx * hr * .05, hy - hr * .06, hr * .11, '#1b1620');        // pupil
    }
    g.beginPath(); g.ellipse(hx + dx * hr * .22, hy + hr * .38, hr * .34, hr * .22, 0, 0, 7); g.fillStyle = '#6d5b69'; g.fill();   // muzzle
    blob(hx + dx * hr * .22, hy + hr * .3, hr * .1, PINK);                                   // nose
  }
  };
  const hanging = !still && !!((ride && ride.phase === 0) || (hop && hop.balloon));
  const drawArms = () => {   // front legs stretched up, gripping the string tight
    g.strokeStyle = DARK; g.lineCap = 'round'; g.lineWidth = r * .32;
    for (const s of [-1, 1]) { g.beginPath(); g.moveTo(s * r * .5, by - r * .15); g.lineTo(s * r * .13, by - r * 1.62); g.stroke(); }
    g.lineCap = 'butt';
    for (const s of [-1, 1]) blob(s * r * .12, by - r * 1.64, r * .2, DARK);   // hooves wrapped around the string
  };
  const arms = hanging ? drawArms : () => {};
  if (away) { arms(); drawHead(); drawBody(); } else { drawBody(); arms(); drawHead(); }   // from behind the body is nearer than the head, so it covers part of it
  g.restore();
}

// The game's logo, right-aligned at xRight: dark letters on a little cloud of wool, with a rose-colored beta.
// ("Lamβert" is a joke spelling used only here; everywhere else the name is LamBert.) The Greek letter is drawn
// by hand so that it matches in every font.
function drawLogo(xRight, baseY) {
  const SIZE = 34, CAP = SIZE * .72;   // font size and the height of a capital letter
  const LETTERS = ['L', 'a', 'm', 'β', 'e', 'r', 't'];
  const INK = '#3f343c', ROSE = '#c75b7a';   // the same dark as LamBert's face; the beta is rose
  g.save();
  g.font = 'bold ' + SIZE + 'px "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif';
  g.textAlign = 'center'; g.lineJoin = 'round'; g.lineCap = 'round';
  const widths = LETTERS.map(ch => ch === 'β' ? SIZE * .62 : g.measureText(ch).width + 1);
  const total = widths.reduce((a, b) => a + b, 0);
  // the cloud of wool behind the letters: puffs of random sizes and heights along its top and bottom edges
  const left = xRight - total - 10, right = xRight + 10, midY = baseY - CAP / 2, r1 = SIZE * .4;
  const rnd = (a, b) => { const q = Math.sin(a * 91.7 + b * 47.3) * 43758.5453; return q - Math.floor(q); };   // fixed pseudo-random numbers, so the cloud never changes
  // The cloud is narrow at both ends and puffs out in the middle: bulge(t) is about .45 at the ends and 1 in the
  // middle (t = 0 at the left end, 1 at the right end), and it scales both the puffs' sizes and how far they sit
  // above and below the middle line.
  const bulge = px => .45 + .55 * Math.sin(Math.PI * Math.min(1, Math.max(0, (px - left) / (right - left))));
  const puffs = [[left, midY, r1 * .7 * (.9 + .2 * rnd(0, 0))], [right, midY, r1 * .7 * (.9 + .2 * rnd(1, 0))]];
  const n = Math.round((right - left) / (r1 * 1.3));
  for (let k = 0; k <= n; k++) {
    const px = left + (right - left) * (k + (rnd(k, 1) - .5) * .7) / n, b = bulge(px);
    puffs.push([px, midY, r1 * (.7 + .5 * b)]);   // a core puff on the middle line: it fills the body of the cloud
    puffs.push([px, midY - r1 * (.3 + .5 * rnd(k, 2)) * (.4 + 1.1 * b), r1 * (.5 + .5 * rnd(k, 3)) * (.7 + .55 * b)]);   // top edge
    puffs.push([px + (rnd(k, 4) - .5) * r1, midY + r1 * (.3 + .5 * rnd(k, 5)) * (.4 + 1.1 * b), r1 * (.5 + .5 * rnd(k, 6)) * (.7 + .55 * b)]);   // bottom edge
  }
  for (const [px, py, pr] of puffs) blob(px, py, pr + 1.5, '#c9c2d0');   // outlines first, so only the outer edge of the cloud shows
  for (const [px, py, pr] of puffs) blob(px, py, pr, '#fffdf6');
  let x = xRight - total;
  LETTERS.forEach((ch, i) => {
    g.save(); g.translate(x + widths[i] / 2, baseY);
    if (ch === 'β') {
      const w = widths[i] * .8, h = CAP;   // beta: a stem with two bowls, drawn as one thick rounded line
      g.translate(-w / 2, -h);
      g.strokeStyle = ROSE; g.lineWidth = SIZE * .15;
      g.beginPath(); g.moveTo(.15 * w, 1.28 * h); g.lineTo(.15 * w, .28 * h);
      g.bezierCurveTo(.15 * w, -.05 * h, .8 * w, -.05 * h, .8 * w, .25 * h);
      g.bezierCurveTo(.8 * w, .42 * h, .55 * w, .5 * h, .4 * w, .5 * h);
      g.bezierCurveTo(.95 * w, .5 * h, 1.0 * w, 1.0 * h, .5 * w, 1.0 * h);
      g.bezierCurveTo(.35 * w, 1.0 * h, .25 * w, .97 * h, .15 * w, .92 * h);
      g.stroke();
    } else {
      g.fillStyle = INK; g.fillText(ch, 0, 0);
    }
    g.restore();
    x += widths[i];
  });
  g.restore();
}

// One small picture of LamBert for each spare life (the life being played is not shown), in a column down the far
// left edge, as in the original game. A column there hides the balloons least.
function drawLives() {
  for (let n = 0; n < lives - 1; n++) {
    g.save(); g.translate(21, 94 + n * 32); g.scale(.8, .8); drawPlayer(0, 0, true); g.restore();
  }
}

// ---- Who is in front of whom: the thing nearer the viewer is drawn later, so it covers the other ----
const depth = (x, y, z) => x + y + z;   // larger = nearer the viewer (who looks along the x, y and z axes together)
function hopDepth(p) {   // depth of something partway through the hop p

  const rows = Math.max(1, highScores.length), pw = Math.min(W - 24, 360), px = (W - pw) / 2, top = 96;

    g.fillStyle = '#1d3557'; g.font = '18' + F;

function draw() {
  drawSky();
  // Past a rear wall he is behind the cube structure, so draw him before the cubes
  const behind = (hop && hop.back && hop.t >= .5) || (fall && fall.back);
  const drawMe = () => {
    if (over) return;
    if (ride) { const p = ridePos(); drawPlayer(p[0], p[1]); }
    else if (hop) { const p = hopPos(hop, Math.min(1, hop.t)); drawPlayer(p[0], p[1]); }
    else if (fall) drawPlayer(fall.x, fall.y);
    else {
      const p = P(pi + .5, pj + .5, h[pi][pj]);
      if (bump) { const s = Math.sin(Math.PI * bump.t); p[0] += (bump.di - bump.dj) * .866 * A * .12 * s; p[1] += (bump.di + bump.dj) * .5 * A * .12 * s - A * .3 * s; }   // a little hop toward the spot he cannot reach

  if (behind) drawMe();
  enemies.filter(behindWall).forEach(drawEnemy);
  drawCubes();
  const bob = d => Math.sin(performance.now() / 500 + d.i * 1.3 + d.j * 1.7) * 2.5;   // balloons sway gently
  balloons.forEach(d => { const riding = ride && ride.d === d && ride.phase === 0; drawBalloon(riding ? ridePos() : balloonPos(d), d, riding ? 0 : bob(d), riding ? 0 : A * BALLOON_TAIL); });
  drawPops();
  const actors = enemies.filter(e => !behindWall(e)).map(e => ({d: enemyDepth(e), draw: () => drawEnemy(e)}));
  if (!behind) actors.push({d: playerDepth(), draw: drawMe});
  actors.sort((a, b) => a.d - b.d);   // farthest first
  actors.forEach(a => a.draw());
  g.fillStyle = '#1d3557'; g.font = '20px -apple-system,Helvetica,Arial,sans-serif'; g.textAlign = 'left';
  g.fillText('Score ' + score.toLocaleString('en-US'), 14, 30);
  g.fillText('Level ' + level, 14, 54);
  drawLogo(W - 24, 44);
  drawLives();
  drawSpeaker();
  if (noticeT > 0) { g.textAlign = 'center'; g.fillStyle = '#b4531a'; g.font = 'bold 28px -apple-system,Helvetica,Arial,sans-serif'; g.lineWidth = 5; g.strokeStyle = '#ffffff'; g.strokeText(notice, W / 2, 215); g.fillText(notice, W / 2, 215); }
  g.textAlign = 'center'; g.fillStyle = '#4a6a8f'; g.font = '15px -apple-system,Helvetica,Arial,sans-serif';
  g.fillText('Hop with Q E Z C, the arrow keys, or a diagonal swipe', W / 2, H - 16);
  if (over || msg) {
    if (over && !entering) drawScoreTable();
    g.fillStyle = '#b4531a'; g.font = 'bold 40px -apple-system,Helvetica,Arial,sans-serif';
    g.lineWidth = 6; g.lineJoin = 'round'; g.strokeStyle = '#ffffff'; g.strokeText(over ? 'Game over' : msg, W / 2, 150);
    g.fillText(over ? 'Game over' : msg, W / 2, 150);
    if (over) g.lineJoin = 'miter';
  }
}

// ---- Sound: most sounds are made in code with the Web Audio API; the bleat and the growl are recorded clips (SOUND_CLIPS, at the bottom); see section 7b above ----
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
let savedSound = null;
try { savedSound = localStorage.getItem('lambert-sound'); } catch (err) {}
const audio = {ctx: null, on: savedSound ? savedSound === 'on' : !IS_TOUCH};   // on by default on a computer, off on a touch device
const SPEAKER = {x: W - 26, y: H - 26, r: 18};   // the mute button, bottom right
let lastBounce = 0;

function unlockAudio() {   // browsers only allow sound after a key press or a touch
  if (!audio.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audio.ctx = new AC(); }
  if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume();
  loadClips();
}

// Recorded clips (see section 7b): SOUND_CLIPS, a block of base64 text at the very bottom of the file, holds mp3
// recordings. They are decoded once, when sound is first unlocked, into clipBuffers (a name maps to a decoded
// sound, or null while decoding or if decoding failed; sound() then falls back to the synthesized version).
const clipBuffers = {};
const SOUND_BOOST = 2.5;    // multiplies the volume of every synthesized sound (tone() and noiseBurst()); the owner found them too quiet next to the bleat. Raise or lower it to change them all at once
const BLEAT_VOLUME = 0.2;   // volume of the recorded bleat when LamBert falls (0 to 1); the other sounds are quiet, so tune by ear
const GROWL_VOLUME = 0.3;   // volume of the recorded growl while Wolfy's costume shakes (0 to 1)
function loadClips() {
  if (!audio.ctx || typeof SOUND_CLIPS === 'undefined') return;
  for (const name in SOUND_CLIPS) {
    if (name in clipBuffers) continue;   // already decoded or being decoded
    clipBuffers[name] = null;
    try {
      const bin = atob(SOUND_CLIPS[name]), bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      audio.ctx.decodeAudioData(bytes.buffer, buf => { clipBuffers[name] = buf; }, () => {});   // callback form: works in every Safari
    } catch (err) {}
  }
}
function playClip(name, vol) {   // play a recorded clip; returns false if it is not ready (the caller then uses a synthesized sound)
  if (!audio.on || !audio.ctx || !clipBuffers[name]) return false;
  const src = audio.ctx.createBufferSource(), gn = audio.ctx.createGain();
  src.buffer = clipBuffers[name]; gn.gain.value = vol;
  src.connect(gn); gn.connect(audio.ctx.destination); src.start();
  return true;
}

function tone(f0, dur, type, vol, f1, delay) {   // a note that slides from f0 to f1 Hz and fades out

  o.type = type; o.frequency.setValueAtTime(f0, t0);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  gn.gain.setValueAtTime(vol * SOUND_BOOST, t0); gn.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(gn); gn.connect(c.destination); o.start(t0); o.stop(t0 + dur + .02);
}

function noiseBurst(dur, vol, freq, delay) {   // a short puff of filtered noise (the balloon pop)
  if (!audio.on || !audio.ctx) return;
  const c = audio.ctx, t0 = c.currentTime + (delay || 0), len = Math.max(1, Math.floor(c.sampleRate * dur));
  const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = c.createBufferSource(), f = c.createBiquadFilter(), gn = c.createGain();
  src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; gn.gain.value = vol * SOUND_BOOST;
  src.connect(f); f.connect(gn); gn.connect(c.destination); src.start(t0);
}

function sound(name) {
  if (!audio.on || !audio.ctx) return;
  switch (name) {
    case 'hop': tone(520, .07, 'triangle', .05, 780); break;                       // LamBert's hop: a soft tick
    case 'blocked': tone(330, .09, 'triangle', .05, 210); break;                   // he tried to hop too high: a little bonk
    case 'bounce': { const now = performance.now(); if (now - lastBounce > 90) { lastBounce = now; tone(170, .06, 'sine', .02, 105); } break; }   // very quiet, and never more than one every 90 ms
    case 'wolfstep': tone(120, .07, 'triangle', .035, 90); break;
    case 'grab': tone(420, .12, 'sine', .06, 900); break;                          // grabbing the balloon string
    case 'pop': noiseBurst(.09, .07, 1500); tone(700, .06, 'triangle', .03, 280); break;   // the balloon bursts (kept soft: not harsh)
    case 'yelp': tone(900, .35, 'sawtooth', .04, 200); break;                      // Wolfy falls to his doom
    case 'fall': if (!playClip('bleat', BLEAT_VOLUME)) tone(900, .55, 'sine', .07, 140); break;   // LamBert falls: a recorded bleat (the old falling whistle is only a fallback)
    case 'growl': playClip('growl', GROWL_VOLUME); break;                          // Wolfy growls while the costume shakes (recorded only, no synthesized fallback)
    case 'death': for (let n = 0; n < 6; n++) tone(340 + (n % 2 ? -30 : 30), .07, 'sawtooth', .045, null, n * .065); break;   // a bleat: baa
    case 'extralife': [784, 988, 1319].forEach((f, n) => tone(f, .16, 'triangle', .08, null, n * .11)); break;
    case 'clear': [523, 659, 784, 1047].forEach((f, n) => tone(f, .2, 'triangle', .08, null, n * .12)); break;

function toggleSound() {

function hitSpeaker(clientX, clientY) {   // is this screen position on the speaker button?
  const r = cv.getBoundingClientRect(), x = (clientX - r.left) * W / r.width, y = (clientY - r.top) * H / r.height;

}
cv.addEventListener('pointerdown', e => { unlockAudio(); if (hitSpeaker(e.clientX, e.clientY)) toggleSound(); });

function drawSpeaker() {   // the mute button: a little speaker, with sound waves when the sound is on and an X when it is off
  g.save(); g.translate(SPEAKER.x, SPEAKER.y);
  g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.arc(0, 0, SPEAKER.r, 0, 7); g.fill();
  g.fillStyle = '#3f343c'; g.strokeStyle = '#3f343c'; g.lineWidth = 2; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-9, -3.5); g.lineTo(-5, -3.5); g.lineTo(0, -8); g.lineTo(0, 8); g.lineTo(-5, 3.5); g.lineTo(-9, 3.5); g.closePath(); g.fill();
  if (audio.on) { for (const rr of [4, 8]) { g.beginPath(); g.arc(0, 0, rr + 2, -.9, .9); g.stroke(); } }
  else { g.beginPath(); g.moveTo(4, -5); g.lineTo(11, 5); g.moveTo(11, -5); g.lineTo(4, 5); g.stroke(); }
  g.restore();
}

// Q = up-left, E = up-right, Z = down-left, C = down-right; arrows are rotated 45 degrees
const K = {q: [-1, 0], e: [0, -1], c: [1, 0], z: [0, 1],
           ArrowLeft: [-1, 0], ArrowUp: [0, -1], ArrowRight: [1, 0], ArrowDown: [0, 1]};
addEventListener('keydown', e => {
  if (entering) { if (e.key === 'Enter') submitName(); return; }   // typing a name: the game's keys are off
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  unlockAudio();
  if (k === 'm') { toggleSound(); return; }
  if (k === ' ') {
    e.preventDefault();
    if (over && overT <= 0) startNewGame();
  } else if (K[k]) { e.preventDefault(); move(K[k][0], K[k][1]); }
});

// Touch: a diagonal swipe anywhere on the screen hops in that screen direction
let sx = 0, sy = 0, swiped = false;
addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; swiped = hitSpeaker(t.clientX, t.clientY); }, {passive: true});   // a touch on the speaker button is not a swipe
addEventListener('touchmove', e => {
  e.preventDefault();
  if (swiped) return;
  const t = e.touches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  if (Math.hypot(dx, dy) < 24) return;
  swiped = true;
  const d = dy < 0 ? (dx < 0 ? [-1, 0] : [0, -1]) : (dx < 0 ? [0, 1] : [1, 0]);
  move(d[0], d[1]);
}, {passive: false});
addEventListener('touchend', () => {
  unlockAudio();
  if (!swiped && over && !entering && overT <= 0) startNewGame();   // tap to restart
});

newLevel();
let last = performance.now();
(function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (overT > 0) overT -= dt;
  update(dt); draw(); requestAnimationFrame(frame);
})(last);
