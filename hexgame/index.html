<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hexagon Tiling</title>
<style>
  :root {
    --bg: #f6f4ef; --fg: #1d1d1f; --hex: #ffffff; --grid: #e0dcd2; --sel: #e8e3d6;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171a; --fg: #f2f0ea; --hex: #222228; --grid: #35353d; --sel: #2e2e36;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17171a; --fg: #f2f0ea; --hex: #222228; --grid: #35353d; --sel: #2e2e36;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden; position: relative; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  button, select {
    font: inherit; font-size: 14px; color: var(--fg); background: var(--hex);
    border: 1px solid var(--grid); border-radius: 8px; padding: 6px 7px; cursor: pointer;
  }
  #bar { position: absolute; top: 8px; right: 10px; display: flex; gap: 6px; }
  #win {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.45);
  }
  #win .card {
    background: var(--bg); color: var(--fg); padding: 24px 32px; border-radius: 16px;
    text-align: center; font-size: 1.2rem; line-height: 1.6;
  }
  #win b { font-size: 1.6rem; }
  #win button { font-size: 1rem; padding: 8px 16px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <select id="m" title="Hexagon size (tiles per side)">
    <option value="3">small</option>
    <option value="4" selected>medium</option>
    <option value="6">large</option>
  </select>
  <!-- The "number given" drop-down is hidden for now; remove the word "hidden" to bring it back. -->
  <select id="n" title="Tiles placed by the computer" hidden></select>
  <button id="new">New</button>
  <button id="reset">Reset</button>
</div>
<div id="win"><div class="card"><b>Hexagon complete!</b><br><span id="wintxt"></span><br>Your time: <b id="wintime"></b><br><br><button id="again">Play again</button></div></div>
<script>
(function () {
  // ---------- Settings ----------
  var h = Math.sqrt(3) / 2;
  // The whole board (and the pile icons) is turned 30 degrees clockwise on screen, so two
  // sides of the hexagon are vertical and the board fits a portrait phone screen better.
  var COS = Math.cos(Math.PI / 6), SIN = Math.sin(Math.PI / 6);
  function turn(dx, dy) { return [dx * COS - dy * SIN, dx * SIN + dy * COS]; }
  var TYPES = ["left", "middle", "right"];
  var COLORS = { left: "#3fae4c", middle: "#d9453d", right: "#3b6fd4" };
  var DARK   = { left: "#25692e", middle: "#8f2823", right: "#223f80" };   // computer-placed (locked) tiles
  // For each hexagon size M: choices for how many tiles the computer gives (total is 3*M*M).
  var GIVEN = {
    3:  [24, 20, 16, 12, 9, 6, 3, 0],
    4:  [44, 40, 36, 32, 28, 24, 16, 8, 0],
    6:  [100, 90, 80, 70, 60, 48, 36, 24, 12, 0]
  };
  var DEFAULT = { 3: 9, 4: 16, 6: 36 };   // about 1/3 of the total

  // ---------- Geometry ----------
  // Triangular lattice: lattice point (i,j) sits at x = i + j/2, y = j * h.
  // Every lattice triangle is either "A" (apex down) or "B" (apex up).
  function cart(i, j) { return [i + 0.5 * j, j * h]; }
  function inPoly(p, poly) {            // convex polygon, clockwise vertices
    for (var k = 0; k < poly.length; k++) {
      var a = poly[k], b = poly[(k + 1) % poly.length];
      if ((b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]) < 0) return false;
    }
    return true;
  }
  function centroid(pts) {
    var x = 0, y = 0;
    pts.forEach(function (p) { x += p[0]; y += p[1]; });
    return [x / pts.length, y / pts.length];
  }
  // A tile = two adjacent triangles. Corner points and triangle keys per orientation.
  function poly(t, i, j) {
    if (t === "right")  return [cart(i, j), cart(i + 1, j), cart(i + 1, j + 1), cart(i, j + 1)];
    if (t === "middle") return [cart(i, j), cart(i + 1, j), cart(i, j + 1), cart(i - 1, j + 1)];
    return [cart(i + 1, j), cart(i + 1, j + 1), cart(i, j + 2), cart(i, j + 1)];
  }
  function keys(t, i, j) {
    if (t === "right")  return ["A" + i + "," + j, "B" + i + "," + j];
    if (t === "middle") return ["A" + i + "," + j, "B" + (i - 1) + "," + j];
    return ["B" + i + "," + j, "A" + i + "," + (j + 1)];
  }
  function triCentroid(k, a, b) {
    return centroid(k === "A" ? [cart(a, b), cart(a + 1, b), cart(a, b + 1)]
                              : [cart(a + 1, b), cart(a + 1, b + 1), cart(a, b + 1)]);
  }
  function sortedKey(pts) {
    return pts.map(function (p) { return p[0].toFixed(2) + "," + p[1].toFixed(2); }).sort().join("|");
  }

  // Everything that depends on the hexagon size M is rebuilt by build(M).
  var M, PER, TOTAL, CTR, HEX, inside, tris, cands, byCorners, byTris, rings;

  function build(m) {
    M = m; PER = M * M; TOTAL = 3 * PER; CTR = [M / 2, M * h];
    // Flat-top hexagon with side M, clockwise on screen.
    HEX = [[0, 0], [M, 0], [1.5 * M, M * h], [M, 2 * M * h], [0, 2 * M * h], [-M / 2, M * h]];
    inside = {}; tris = []; cands = []; byCorners = {}; byTris = {}; rings = [];
    var lo = -M - 2, hi = M + 2, jhi = 2 * M + 2, i, j;

    // The 6*M*M small triangles inside the hexagon.
    for (i = lo; i <= hi; i++) for (j = -2; j <= jhi; j++) {
      var A = [cart(i, j), cart(i + 1, j), cart(i, j + 1)];
      var B = [cart(i + 1, j), cart(i + 1, j + 1), cart(i, j + 1)];
      if (inPoly(centroid(A), HEX)) { inside["A" + i + "," + j] = 1; tris.push(A); }
      if (inPoly(centroid(B), HEX)) { inside["B" + i + "," + j] = 1; tris.push(B); }
    }
    // Every spot a tile may snap to (both triangles inside the hexagon).
    TYPES.forEach(function (t) {
      for (var i = lo; i <= hi; i++) for (var j = -2; j <= jhi; j++) {
        var k = keys(t, i, j);
        if (inside[k[0]] && inside[k[1]]) {
          var c = { t: t, i: i, j: j, c: centroid(poly(t, i, j)) };
          cands.push(c);
          byCorners[sortedKey(poly(t, i, j))] = c;
          byTris[k.slice().sort().join("|")] = c;
        }
      }
    });
    // For each interior lattice point: its 6 surrounding triangles, in circular order.
    for (i = lo; i <= hi; i++) for (j = -2; j <= jhi; j++) {
      var vtx = cart(i, j);
      var ring = [["A", i, j], ["A", i - 1, j], ["A", i, j - 1], ["B", i - 1, j], ["B", i - 1, j - 1], ["B", i, j - 1]]
        .map(function (x) {
          var c = triCentroid(x[0], x[1], x[2]);
          return { key: x[0] + x[1] + "," + x[2], ang: Math.atan2(c[1] - vtx[1], c[0] - vtx[0]) };
        });
      if (ring.every(function (r) { return inside[r.key]; })) {
        ring.sort(function (a, b) { return a.ang - b.ang; });
        rings.push(ring.map(function (r) { return r.key; }));
      }
    }
  }

  // ---------- Random tiling generator ----------
  // Start from one easy tiling, then apply many random "flips". A flip takes the 6
  // triangles around an interior lattice point; if they form 3 tiles (a little hexagon),
  // re-pair them the other way (like adding or removing one cube in a stack of cubes).
  function randomTiling(flips) {
    var owner = {}, list = [];
    function add(c) {
      var t = { t: c.t, i: c.i, j: c.j };
      list.push(t);
      keys(c.t, c.i, c.j).forEach(function (k) { owner[k] = t; });
    }
    function drop(t) {
      list.splice(list.indexOf(t), 1);
      keys(t.t, t.i, t.j).forEach(function (k) { delete owner[k]; });
    }
    // Starting tiling: three big MxM rhombi meeting at the center, one orientation each.
    var C = [0, M], dirs = [[0, -1], [1, 0], [-1, 1]];
    for (var r = 0; r < 3; r++) {
      var p = dirs[r], q = dirs[(r + 1) % 3];
      for (var a = 0; a < M; a++) for (var b = 0; b < M; b++) {
        var oi = C[0] + a * p[0] + b * q[0], oj = C[1] + a * p[1] + b * q[1];
        add(byCorners[sortedKey([cart(oi, oj), cart(oi + p[0], oj + p[1]),
          cart(oi + p[0] + q[0], oj + p[1] + q[1]), cart(oi + q[0], oj + q[1])])]);
      }
    }
    for (var n = 0; n < flips; n++) {
      var rg = rings[Math.floor(Math.random() * rings.length)];
      var o = [];
      for (var x = 0; x < 6; x++) o.push(owner[rg[x]]);
      var s;
      if (o[0] === o[1] && o[2] === o[3] && o[4] === o[5]) s = 1;
      else if (o[1] === o[2] && o[3] === o[4] && o[5] === o[0]) s = 0;
      else continue;
      o.filter(function (t, k) { return o.indexOf(t) === k; }).forEach(drop);
      for (var m = 0; m < 3; m++) {
        var k1 = rg[(s + 2 * m) % 6], k2 = rg[(s + 2 * m + 1) % 6];
        add(byTris[[k1, k2].sort().join("|")]);
      }
    }
    return list;
  }

  // ---------- Game state ----------
  var tiles = [];          // placed tiles: {t, i, j, locked}
  var startN = 16;         // how many tiles the computer places
  var selected = null;     // selected pile type
  var drag = null;         // {tile, off, sx, sy, moved} while pressing on a placed tile
  var ptr = null;          // pointer position (lattice coordinates)
  var ghost = null;        // snap preview for mouse hover
  var won = false;
  var startTime = Date.now(), finalMs = 0, winTimer = null;   // stopwatch: starts when a puzzle appears, stops on a win

  function remaining(t) {
    var n = 0;
    tiles.forEach(function (x) { if (x.t === t) n++; });
    return PER - n;
  }
  function occupied(except) {
    var o = {};
    tiles.forEach(function (x) {
      if (x !== except) keys(x.t, x.i, x.j).forEach(function (k) { o[k] = 1; });
    });
    return o;
  }
  // Nearest free snap spot of this orientation to point p (within 1 unit), or null.
  function snap(type, p, except) {
    var o = occupied(except), best = null, bd = 1.0;
    cands.forEach(function (c) {
      if (c.t !== type) return;
      var k = keys(c.t, c.i, c.j);
      if (o[k[0]] || o[k[1]]) return;
      var d = Math.hypot(c.c[0] - p[0], c.c[1] - p[1]);
      if (d < bd) { bd = d; best = c; }
    });
    return best;
  }
  function newPuzzle() {
    var full = randomTiling(30000);   // a complete random tiling
    for (var k = full.length - 1; k > 0; k--) {          // shuffle, then lock the first startN
      var r = Math.floor(Math.random() * (k + 1)), tmp = full[k]; full[k] = full[r]; full[r] = tmp;
    }
    tiles = full.slice(0, startN).map(function (t) { t.locked = true; return t; });
    startTime = Date.now();
    clearState(); draw();
  }
  function reset() {
    tiles = tiles.filter(function (t) { return t.locked; });
    clearState(); draw();
  }
  function clearState() {
    selected = null; drag = null; ghost = null; won = false;
    clearTimeout(winTimer);
    document.getElementById("win").style.display = "none";
  }
  function fmt(ms) {                          // milliseconds -> m:ss
    var s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ":" + (s % 60 < 10 ? "0" : "") + (s % 60);
  }
  function checkWin() {
    if (tiles.length === TOTAL) {
      won = true;
      finalMs = Date.now() - startTime;
      document.getElementById("wintxt").textContent = "All " + TOTAL + " tiles fit.";
      document.getElementById("wintime").textContent = fmt(finalMs);
      winTimer = setTimeout(function () {   // the clock has already stopped; this just lets the player admire the board
        document.getElementById("win").style.display = "flex";
      }, 500);
    }
  }
  function setSize(m) {          // change hexagon size and start a new puzzle
    build(m);
    startN = DEFAULT[m];
    var sel = document.getElementById("n");
    sel.innerHTML = "";
    GIVEN[m].forEach(function (v) {
      var op = document.createElement("option");
      op.value = v; op.textContent = v + " given";
      sel.appendChild(op);
    });
    sel.value = String(startN);
    resize();
    newPuzzle();
  }

  // ---------- Drawing ----------
  var cv = document.getElementById("c"), ctx = cv.getContext("2d");
  var W, H, u, cx, cy, pileH, pileW, pileL, col = {};

  function refreshColors() {
    var s = getComputedStyle(document.documentElement);
    ["fg", "hex", "grid", "sel"].forEach(function (n) { col[n] = s.getPropertyValue("--" + n).trim(); });
  }
  function resize() {
    var dpr = window.devicePixelRatio || 1;
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pileH = Math.max(96, Math.min(150, H * 0.2));
    u = Math.min((W - 24) / (2 * M * h), (H - pileH - 60) / (2 * M));   // pixels per unit
    cx = W / 2; cy = 52 + (H - pileH - 60) / 2;                        // hexagon center
    pileW = Math.min(W, 2 * M * h * u); pileL = cx - pileW / 2;   // piles are never wider than the hexagon
    refreshColors();
    draw();
  }
  function toScreen(p) { var r = turn(p[0] - CTR[0], p[1] - CTR[1]); return [cx + r[0] * u, cy + r[1] * u]; }
  function toCart(x, y) {
    var dx = (x - cx) / u, dy = (y - cy) / u;     // undo the 30 degree turn
    return [CTR[0] + dx * COS + dy * SIN, CTR[1] - dx * SIN + dy * COS];
  }

  function path(pts) {
    ctx.beginPath();
    pts.forEach(function (p, k) { if (k) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]); });
    ctx.closePath();
  }
  // Path for a rectangle with rounded corners (radius r).
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function drawTile(pts, t, alpha, locked) {
    ctx.globalAlpha = alpha || 1;
    path(pts);
    ctx.fillStyle = (locked ? DARK : COLORS)[t]; ctx.fill();
    ctx.lineWidth = 1.5; ctx.lineJoin = "round"; ctx.strokeStyle = "#000"; ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function draw() {
    if (!HEX) return;
    ctx.clearRect(0, 0, W, H);

    // Hexagon background, faint snap grid, outline
    path(HEX.map(toScreen)); ctx.fillStyle = col.hex; ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = col.grid;
    tris.forEach(function (v) { path(v.map(toScreen)); ctx.stroke(); });
    path(HEX.map(toScreen)); ctx.lineWidth = 3; ctx.strokeStyle = col.fg; ctx.stroke();

    // Placed tiles (a tile being dragged is drawn last, on top)
    var dragging = drag && drag.moved;
    tiles.forEach(function (t) {
      if (dragging && drag.tile === t) return;
      drawTile(poly(t.t, t.i, t.j).map(toScreen), t.t, 1, t.locked);
    });
    if (ghost && !drag) drawTile(poly(ghost.t, ghost.i, ghost.j).map(toScreen), ghost.t, 0.45);
    if (dragging && ptr) {
      var t = drag.tile, c = centroid(poly(t.t, t.i, t.j));
      var dx = ptr[0] - drag.off[0] - c[0], dy = ptr[1] - drag.off[1] - c[1];
      drawTile(poly(t.t, t.i, t.j).map(function (p) { return toScreen([p[0] + dx, p[1] + dy]); }), t.t, 0.9);
    }

    // Timer
    ctx.fillStyle = col.fg; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    ctx.font = "600 18px ui-monospace, Menlo, monospace";
    ctx.fillText(fmt(won ? finalMs : Date.now() - startTime), 14, 28);

    // Piles
    var s = (pileH - 44) / 1.8;
    var iconY = H - 30 - (pileH - 30) / 2;
    TYPES.forEach(function (t, k) {
      var x = pileL + pileW * (k + 0.5) / 3, n = remaining(t);
      if (selected === t) {
        roundRect(x - pileW / 6 + 6, H - pileH + 4, pileW / 3 - 12, pileH - 8, 14);
        ctx.fillStyle = col.sel; ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = col.fg; ctx.stroke();
      }
      var base = poly(t, 0, 0), c = centroid(base);
      var pts = base.map(function (p) { var r = turn(p[0] - c[0], p[1] - c[1]);   /* same 30 degree turn as the board */ return [x + r[0] * s, iconY + r[1] * s]; });
      if (n > 1) drawTile(pts.map(function (p) { return [p[0] + 4, p[1] + 4]; }), t, 0.6);
      drawTile(pts, t, n > 0 ? 1 : 0.25);
      ctx.fillStyle = col.fg; ctx.textAlign = "center";
      ctx.font = "700 20px -apple-system, Arial, sans-serif";
      ctx.fillText(String(n), x, H - 14);
    });
  }

  // ---------- Input (mouse and touch via pointer events) ----------
  function pos(e) {
    var r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  cv.addEventListener("pointerdown", function (e) {
    if (won) return;
    var m = pos(e);
    cv.setPointerCapture(e.pointerId);

    if (m.y > H - pileH) {                       // tapped a pile
      var t = TYPES[Math.max(0, Math.min(2, Math.floor((m.x - pileL) / (pileW / 3))))];
      if (remaining(t) > 0) selected = (selected === t) ? null : t;
      ghost = null; draw(); return;
    }
    var p = toCart(m.x, m.y); ptr = p;
    for (var n = tiles.length - 1; n >= 0; n--) { // pressed a placed tile: drag it, or tap to remove it
      var tl = tiles[n];
      if (inPoly(p, poly(tl.t, tl.i, tl.j))) {
        if (tl.locked) { draw(); return; }        // computer-placed tiles cannot be changed
        var c = centroid(poly(tl.t, tl.i, tl.j));
        drag = { tile: tl, off: [p[0] - c[0], p[1] - c[1]], sx: m.x, sy: m.y, moved: false };
        ghost = null; draw(); return;
      }
    }
    if (selected) {                               // tapped empty space: place a tile
      var spot = snap(selected, p, null);
      if (spot) {
        tiles.push({ t: selected, i: spot.i, j: spot.j });
        if (remaining(selected) === 0) selected = null;
        ghost = null; checkWin();
      }
    }
    draw();
  });

  cv.addEventListener("pointermove", function (e) {
    var m = pos(e); ptr = toCart(m.x, m.y);
    if (drag && !drag.moved && Math.hypot(m.x - drag.sx, m.y - drag.sy) > 6) drag.moved = true;
    if (!drag && selected && e.pointerType === "mouse" && m.y < H - pileH) ghost = snap(selected, ptr, null);
    else if (!drag) ghost = null;
    draw();
  });

  cv.addEventListener("pointerup", function (e) {
    if (!drag) return;
    var m = pos(e); ptr = toCart(m.x, m.y);
    var t = drag.tile;
    if (!drag.moved) {                                              // a tap: remove the tile
      tiles.splice(tiles.indexOf(t), 1);
    } else {
      var target = [ptr[0] - drag.off[0], ptr[1] - drag.off[1]];
      var spot = snap(t.t, target, t);
      if (spot) { t.i = spot.i; t.j = spot.j; }
      else if (m.y > H - pileH) tiles.splice(tiles.indexOf(t), 1);  // dropped on the piles: return it
    }
    drag = null; checkWin(); draw();
  });
  cv.addEventListener("pointercancel", function () { drag = null; draw(); });
  cv.addEventListener("pointerleave", function () { if (!drag) { ghost = null; draw(); } });

  document.getElementById("reset").addEventListener("click", reset);
  document.getElementById("new").addEventListener("click", newPuzzle);
  document.getElementById("again").addEventListener("click", newPuzzle);
  document.getElementById("m").addEventListener("change", function (e) { setSize(parseInt(e.target.value, 10)); });
  document.getElementById("n").addEventListener("change", function (e) {
    startN = parseInt(e.target.value, 10); newPuzzle();
  });
  window.addEventListener("resize", resize);
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { refreshColors(); draw(); });
  setInterval(function () { if (!won) draw(); }, 250);   // keep the timer ticking
  setSize(4);
})();
</script>
</body>
</html>
